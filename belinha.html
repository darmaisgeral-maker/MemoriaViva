<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#fafaf8;color:#1c1917;padding:0}
.container{max-width:900px;margin:0 auto}
.header{background:#1c1917;color:#fff;padding:20px;text-align:center}
.header h1{font-size:24px;margin-bottom:5px}
.header p{font-size:14px;opacity:.7}
.tabs{display:flex;background:#fff;border-bottom:2px solid #e8e0d8;position:sticky;top:0;z-index:100}
.tab{flex:1;padding:12px;text-align:center;cursor:pointer;font-weight:600;font-size:13px;border-bottom:3px solid transparent;transition:all .2s}
.tab.active{border-bottom-color:#e85a2e;color:#e85a2e;background:#fef5f2}
.tab:hover{background:#f9f9f9}
.content{padding:15px}
.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.section-title{font-size:18px;font-weight:700;color:#1c1917;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.horario-item{display:flex;gap:15px;padding:12px;border-left:4px solid #e85a2e;background:#fef5f2;border-radius:8px;margin-bottom:10px}
.horario-time{font-weight:700;color:#e85a2e;min-width:50px;font-size:16px}
.horario-desc{flex:1}
.horario-title{font-weight:600;margin-bottom:3px}
.horario-detail{font-size:13px;color:#666;line-height:1.5}
.checklist-item{display:flex;align-items:flex-start;gap:12px;padding:12px;border-radius:8px;margin-bottom:8px;cursor:pointer;transition:all .2s;border:2px solid #e8e0d8}
.checklist-item:hover{background:#f9f9f9}
.checklist-item.done{background:#edf4f0;border-color:#2d6a4f}
.checkbox{width:24px;height:24px;border:2px solid #e8e0d8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s}
.checklist-item.done .checkbox{background:#2d6a4f;border-color:#2d6a4f;color:#fff}
.btn{background:#e85a2e;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;width:100%;margin-top:10px}
.btn:hover{background:#d14a1e}
.btn-secondary{background:#2d6a4f}
.btn-secondary:hover{background:#1f4a37}
.status{padding:10px 15px;border-radius:8px;font-size:14px;margin-bottom:15px;display:flex;align-items:center;gap:10px}
.status.success{background:#edf4f0;color:#2d6a4f;border:1px solid #2d6a4f44}
.status.warning{background:#fdf5e6;color:#b8750a;border:1px solid #b8750a44}
.status.error{background:#fdf0ee;color:#c0392b;border:1px solid #c0392b44}
.progress-bar{background:#e8e0d8;height:8px;border-radius:4px;overflow:hidden;margin-top:8px}
.progress-fill{background:linear-gradient(90deg,#e85a2e,#2d6a4f);height:100%;transition:width .3s}
.day-selector{display:flex;gap:8px;margin-bottom:15px;overflow-x:auto;padding-bottom:5px}
.day-btn{padding:8px 16px;border:2px solid #e8e0d8;border-radius:8px;background:#fff;cursor:pointer;font-weight:600;white-space:nowrap;transition:all .2s}
.day-btn.active{background:#e85a2e;color:#fff;border-color:#e85a2e}
.day-btn:hover{border-color:#e85a2e}
.nota-box{background:#fef5f2;border-left:4px solid #e85a2e;padding:12px;border-radius:6px;margin-top:10px;font-size:14px;line-height:1.6}
.exercise-item{background:#f9f9f9;padding:12px;border-radius:8px;margin-bottom:8px;border-left:3px solid #2d6a4f}
.exercise-title{font-weight:600;margin-bottom:4px}
.exercise-reps{font-size:12px;color:#666;font-style:italic}
.agua-counter{display:flex;align-items:center;justify-content:center;gap:15px;padding:20px;background:#e3f2fd;border-radius:12px;margin:15px 0}
.agua-btn{width:50px;height:50px;border-radius:50%;border:none;font-size:24px;cursor:pointer;transition:all .2s}
.agua-btn.minus{background:#fdf0ee;color:#c0392b}
.agua-btn.plus{background:#edf4f0;color:#2d6a4f}
.agua-btn:hover{transform:scale(1.1)}
.agua-value{font-size:48px;font-weight:700;color:#1976d2;min-width:80px;text-align:center}
</style>
</head>

function showDayActivities(day) {
  document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  
  const activities = ATIVIDADES_SEMANA[day] || [];
  document.getElementById('day-activities').innerHTML = activities.length ? activities.map((a, i) => `
    <div class="checklist-item" onclick="toggleCheck(this,'ativ_${day}_${i}')">
      <div class="checkbox"></div>
      <div style="flex:1">
        <div class="horario-item" style="border:none;background:transparent;padding:0;margin:0">
          <div class="horario-time">${a.time}</div>
          <div class="horario-desc">
            <div class="horario-title">${a.icon} ${a.title}</div>
            <div class="horario-detail">${a.desc}</div>
          </div>
        </div>
      </div>
    </div>
  `).join('') : '<div style="text-align:center;padding:20px;color:#999">Sem atividades especiais</div>';
  
  // Recarregar checks depois de renderizar
  loadChecks('atividades');
}

function toggleCheck(el, id) {
  el.classList.toggle('done');
  if(!todayData.checks) todayData.checks = {};
  const isDone = el.classList.contains('done');
  todayData.checks[id] = isDone;
  
  // Registar quando foi marcado/desmarcado
  if(!todayData.timestamps) todayData.timestamps = {};
  todayData.timestamps[id] = {
    status: isDone,
    hora: new Date().toLocaleString('pt-PT', { 
      hour: '2-digit', 
      minute: '2-digit',
      day: '2-digit',
      month: '2-digit',
      year: 'numeric'
    })
  };
}

function loadChecks(section) {
  if(!todayData.checks) return;
  document.querySelectorAll('.checklist-item').forEach(el => {
    const match = el.getAttribute('onclick').match(/'([^']+)'/);
    if(match && todayData.checks[match[1]]) {
      el.classList.add('done');
    }
  });
}

function adjustAgua(delta) {
  if(!todayData.agua) todayData.agua = 0;
  todayData.agua = Math.max(0, todayData.agua + delta);
  document.getElementById('agua-count').textContent = todayData.agua;
  const pct = Math.min(100, (todayData.agua / 8) * 100);
  document.getElementById('agua-progress').style.width = pct + '%';
}

function loadAgua() {
  const count = todayData.agua || 0;
  document.getElementById('agua-count').textContent = count;
  const pct = Math.min(100, (count / 8) * 100);
  document.getElementById('agua-progress').style.width = pct + '%';
}

async function saveProgress() {
  todayData.ultima_atualizacao = new Date().toISOString();
  await saveToDB();
  
  // Mostrar mensagem de sucesso na página atual
  const content = document.getElementById('content');
  const statusDiv = document.createElement('div');
  statusDiv.className = 'status success';
  statusDiv.style.marginTop = '15px';
  statusDiv.innerHTML = '✅ Progresso guardado com sucesso!';
  content.appendChild(statusDiv);
  
  setTimeout(() => statusDiv.remove(), 3000);
}

async function saveRegisto() {
  todayData.humor = document.getElementById('reg-humor').value;
  todayData.notas = document.getElementById('reg-notas').value;
  todayData.ultima_atualizacao = new Date().toISOString();
  await saveToDB();
  showStatus('✅ Registo guardado com sucesso!', 'success');
  updateResumo();
}

async function saveToDB() {
  const now = new Date().toISOString();
  
  try {
    const { data, error } = await supabaseClient
      .from('registos_belinha')
      .upsert({
        data: currentDate,
        dados: todayData,
        updated_at: now
      }, { onConflict: 'data' });
    
    if(error) {
      console.error('Erro Supabase:', error);
      alert('❌ Erro ao guardar: ' + error.message);
      return false;
    }
    
    console.log('Dados guardados com sucesso!', data);
    return true;
  } catch(err) {
    console.error('Erro ao guardar:', err);
    alert('❌ Erro ao guardar: ' + err.message);
    return false;
  }
}

async function loadTodayData() {
  const { data, error } = await supabaseClient
    .from('registos_belinha')
    .select('*')
    .eq('data', currentDate)
    .single();
  
  if(data && data.dados) {
    todayData = data.dados;
  } else {
    todayData = {};
  }
  
  // Update form fields if on registo tab
  if(document.getElementById('reg-humor')) {
    document.getElementById('reg-humor').value = todayData.humor || '';
    document.getElementById('reg-notas').value = todayData.notas || '';
    updateResumo();
  }
}

function updateResumo() {
  const checks = todayData.checks || {};
  const totalChecks = Object.keys(checks).length;
  const doneChecks = Object.values(checks).filter(v => v).length;
  const agua = todayData.agua || 0;
  const ultimaAtualizacao = todayData.ultima_atualizacao ? 
    new Date(todayData.ultima_atualizacao).toLocaleString('pt-PT', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    }) : 'Nunca';
  
  document.getElementById('resumo').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px">
      <div style="text-align:center;padding:15px;background:#f9f9f9;border-radius:8px">
        <div style="font-size:32px;font-weight:700;color:#e85a2e">${doneChecks}</div>
        <div style="font-size:13px;color:#666">tarefas concluídas</div>
      </div>
      <div style="text-align:center;padding:15px;background:#f9f9f9;border-radius:8px">
        <div style="font-size:32px;font-weight:700;color:#1976d2">${agua}</div>
        <div style="font-size:13px;color:#666">copos de água</div>
      </div>
    </div>
    <div style="margin-top:15px;padding:12px;background:#e3f2fd;border-radius:8px;text-align:center">
      <strong>⏰ Última atualização:</strong> ${ultimaAtualizacao}
    </div>
    ${todayData.humor ? `<div style="margin-top:10px;padding:12px;background:#fef5f2;border-radius:8px">
      <strong>Humor:</strong> ${todayData.humor.replace('_',' ')}
    </div>` : ''}
    ${todayData.notas ? `<div style="margin-top:10px;padding:12px;background:#f9f9f9;border-radius:8px;line-height:1.6">
      <strong>Notas:</strong><br>${todayData.notas}
    </div>` : ''}
  `;
}

function showStatus(msg, type) {
  const el = document.getElementById('status-msg');
  if(!el) return;
  el.innerHTML = `<div class="status ${type}">${msg}</div>`;
  setTimeout(() => el.innerHTML = '', 5000);
}

// Initialize
showTab('horario');
loadTodayData();
</script>
