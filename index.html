<html lang="pt">
<head>

<title>Memória Viva · DAR+</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400&family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;font-family:'Nunito',system-ui,sans-serif;font-size:15px;line-height:1.5;margin:0;padding:0;background:#1c1917;display:block}
#app{display:flex;flex-direction:column;overflow:hidden;transition:background .6s;position:fixed;top:0;left:0;right:0;bottom:0}

/* ── MODOS VISUAIS ──────────────────────────────── */
.manha {--bg:#fafaf8;--bg2:#f2ede6;--card:#fff;--bord:#e8e0d8;--pri:#e85a2e;--prid:#1c1917;--pril:#f0a080;--tx:#1c1917;--txm:#4a4540;--txl:#9c9490;--sage:#2d6a4f;--sagel:#edf4f0;--gold:#b8750a;--goldl:#fdf5e6;--danger:#c0392b;--dangerl:#fdf0ee;--sh:rgba(28,25,23,.06);--clkbg:#1c1917;--clktx:#fafaf8;--clksub:rgba(250,250,248,.6)}
.tarde  {--bg:#fafaf8;--bg2:#f2ede6;--card:#fff;--bord:#e8e0d8;--pri:#e85a2e;--prid:#1c1917;--pril:#f0a080;--tx:#1c1917;--txm:#4a4540;--txl:#9c9490;--sage:#2d6a4f;--sagel:#edf4f0;--gold:#b8750a;--goldl:#fdf5e6;--danger:#c0392b;--dangerl:#fdf0ee;--sh:rgba(28,25,23,.06);--clkbg:#1c1917;--clktx:#fafaf8;--clksub:rgba(250,250,248,.6)}
.noite  {--bg:#1c1917;--bg2:#2a2520;--card:#2f2b28;--bord:#3d3830;--pri:#e85a2e;--prid:#f0a080;--pril:#e85a2e;--tx:#fafaf8;--txm:#c8c0b8;--txl:#786e68;--sage:#52b788;--sagel:#1a2e24;--gold:#f0c060;--goldl:#2a2010;--danger:#f07060;--dangerl:#2a1510;--sh:rgba(0,0,0,.3);--clkbg:#2f2b28;--clktx:#fafaf8;--clksub:rgba(250,250,248,.5)}

body{background:var(--bg)}
#app{background:var(--bg)}

/* ── BASE ───────────────────────────────────────── */
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px;-webkit-overflow-scrolling:touch;background:var(--bg)}
.card{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 2px 12px var(--sh);border:1.5px solid var(--bord);margin-bottom:11px}
.hdr{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 3px 14px var(--sh);background:var(--clkbg)}
.hdr-title{color:var(--clktx);font-size:17px;font-weight:700;text-align:center;flex:1;font-family:'Fraunces',Georgia,serif}
.back-btn{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:14px;padding:8px 13px;border-radius:11px;cursor:pointer;font-family:inherit;font-weight:600}
.nav{display:flex;background:var(--card);border-top:1.5px solid var(--bord);padding:7px 0 4px;flex-shrink:0;box-shadow:0 -2px 10px var(--sh)}
.nav-item{flex:1;text-align:center;cursor:pointer;padding:4px 2px;border-radius:10px;transition:background .2s}
.nav-icon{font-size:20px;display:block}
.nav-lbl{font-size:10px;color:var(--txl);margin-top:2px;display:block;font-family:'Nunito',system-ui,sans-serif}
.nav-item.on .nav-lbl{color:var(--pri);font-weight:700}
.nav-item.on{background:rgba(74,159,212,.1)}

/* ── RELÓGIO ────────────────────────────────────── */
.clk{border-radius:20px;padding:20px 16px;text-align:center;margin-bottom:14px;box-shadow:0 4px 20px var(--sh);background:var(--clkbg)}
.clk-time{font-size:76px;font-weight:900;color:var(--clktx);line-height:1;letter-spacing:3px;font-family:'Fraunces',Georgia,serif}
.clk-wd{font-size:19px;color:var(--clksub);margin-top:5px;font-family:'Nunito',system-ui,sans-serif}
.clk-date{font-size:14px;color:var(--clksub);margin-top:2px;opacity:.88}
.clk-season{margin-top:8px;font-size:20px;color:var(--clktx)}
.clk-mode-badge{margin-top:6px;font-size:12px;color:var(--clksub);opacity:.8}

/* ── BUTTONS ────────────────────────────────────── */
.btn-pri{background:var(--pri);border:none;border-radius:13px;padding:14px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 3px 12px var(--sh);font-family:'Nunito',system-ui,sans-serif;margin-bottom:10px}
.btn-sec{background:transparent;border:1.5px solid var(--bord);border-radius:11px;padding:9px 14px;font-size:14px;font-weight:600;color:var(--txm);cursor:pointer;font-family:'Nunito',system-ui,sans-serif}
.btn-tile{border-radius:17px;padding:18px 12px;text-align:center;cursor:pointer;border:1.5px solid var(--bord);box-shadow:0 3px 10px var(--sh);transition:transform .12s;background:var(--card)}
.btn-tile:active{transform:scale(.97)}

/* ── FORMS ─────────────────────────────────────── */
input,select,textarea{font-family:'Nunito',inherit;font-size:16px;color:var(--tx);border:1.5px solid var(--bord);border-radius:11px;padding:9px 12px;width:100%;outline:none;background:var(--card);box-sizing:border-box}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
textarea{resize:none}
.lbl{font-size:12px;color:var(--txl);font-weight:600;margin-bottom:4px;display:block;font-family:'Nunito',system-ui,sans-serif}

/* ── MISC ───────────────────────────────────────── */
.sec-title{font-size:14px;font-weight:700;color:var(--prid);margin-bottom:9px;font-family:'Fraunces',Georgia,serif}
.badge{display:inline-flex;align-items:center;border-radius:7px;padding:2px 8px;font-size:11px;font-weight:700;border:1px solid;margin:2px}
.good{color:#1a9e5c;background:#dcfce7;border-color:#1a9e5c44}
.warn{color:#d97706;background:#fef3c7;border-color:#d9770644}
.alert{color:#dc2626;background:#fee2e2;border-color:#dc262644}
.neutral{color:var(--txl);background:var(--bg2);border-color:var(--bord)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:11px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--card);border-radius:13px;padding:10px 8px;text-align:center;border:1.5px solid var(--bord);box-shadow:0 2px 6px var(--sh)}
.stat-v{font-size:14px;font-weight:700;color:var(--prid);display:block;font-family:'Fraunces',Georgia,serif}
.stat-l{font-size:10px;color:var(--txl);margin-top:2px;display:block}
.modal{position:fixed;inset:0;background:rgba(0,10,30,.72);z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px}
.modal-box{background:var(--card);border-radius:22px;padding:22px 18px;width:100%;max-width:320px;box-shadow:0 8px 40px rgba(0,0,0,.4)}
.progress{background:var(--bord);border-radius:20px;height:9px;overflow:hidden;margin-top:5px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--pri),var(--sage));border-radius:20px;transition:width .4s}
.tabs{display:flex;overflow-x:auto;gap:6px;padding:8px 12px 0;background:var(--card);border-bottom:1px solid var(--bord);flex-shrink:0}
.tab-btn{padding:8px 12px;font-size:12px;font-weight:600;border-radius:9px;cursor:pointer;border:1.5px solid var(--bord);white-space:nowrap;background:transparent;color:var(--txm);font-family:'Nunito',system-ui,sans-serif;flex-shrink:0;margin-bottom:8px}
.tab-btn.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.param-card{background:var(--card);border-radius:14px;padding:12px 10px;cursor:pointer;text-align:center;border:2px solid var(--bord);box-shadow:0 2px 8px var(--sh);transition:border-color .15s}
.pin-btn{padding:15px;font-size:20px;border-radius:12px;border:1.5px solid var(--bord);background:var(--card);cursor:pointer;font-weight:700;color:var(--tx);font-family:inherit}
.alarm-overlay{position:fixed;inset:0;background:rgba(0,10,30,.82);z-index:9998;display:flex;align-items:center;justify-content:center;padding:18px}
.toggle-sw{width:48px;height:26px;border-radius:13px;position:relative;cursor:pointer;transition:background .3s;flex-shrink:0}
.toggle-knob{position:absolute;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .3s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.check-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--bord);cursor:pointer}
.check-row:last-child{border-bottom:none}
.reading-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--bg2);font-size:13px}
.reading-row:last-child{border-bottom:none}
.alert-box{border-radius:12px;padding:9px 13px;margin-bottom:7px;display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--pri);opacity:.4;border-radius:4px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

.login-wrap{position:fixed;inset:0;background:#1c1917!important;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100000;padding:28px;overflow-y:auto}
.login-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:28px 22px;width:100%;max-width:340px}
.login-inp{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);border-radius:10px;padding:14px 16px;font-size:16px;color:#fff;width:100%;outline:none;font-family:'Nunito',system-ui,sans-serif;box-sizing:border-box;margin-bottom:10px;display:block}
.login-inp::placeholder{color:rgba(255,255,255,.35);font-size:14px}
.login-inp:focus{border-color:#e85a2e;background:rgba(255,255,255,.12)}
.login-btn{width:100%;background:#fff;border:none;border-radius:10px;padding:15px;font-size:15px;font-weight:700;color:#1c1917;cursor:pointer;margin-top:6px;font-family:'Nunito',system-ui,sans-serif;letter-spacing:.3px}
.login-err{color:#fca5a5;font-size:13px;text-align:center;margin-top:10px;display:none}
</style>
