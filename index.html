<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;font-family:'Nunito',system-ui,sans-serif;font-size:15px;line-height:1.5;margin:0;padding:0;background:#1c1917;display:block}
#app{display:flex;flex-direction:column;overflow:hidden;transition:background .6s;position:fixed;top:0;left:0;right:0;bottom:0}

/* ── MODOS VISUAIS ──────────────────────────────── */
.manha {--bg:#fafaf8;--bg2:#f2ede6;--card:#fff;--bord:#e8e0d8;--pri:#e85a2e;--prid:#1c1917;--pril:#f0a080;--tx:#1c1917;--txm:#4a4540;--txl:#9c9490;--sage:#2d6a4f;--sagel:#edf4f0;--gold:#b8750a;--goldl:#fdf5e6;--danger:#c0392b;--dangerl:#fdf0ee;--sh:rgba(28,25,23,.06);--clkbg:#1c1917;--clktx:#fafaf8;--clksub:rgba(250,250,248,.6)}
.tarde  {--bg:#fafaf8;--bg2:#f2ede6;--card:#fff;--bord:#e8e0d8;--pri:#e85a2e;--prid:#1c1917;--pril:#f0a080;--tx:#1c1917;--txm:#4a4540;--txl:#9c9490;--sage:#2d6a4f;--sagel:#edf4f0;--gold:#b8750a;--goldl:#fdf5e6;--danger:#c0392b;--dangerl:#fdf0ee;--sh:rgba(28,25,23,.06);--clkbg:#1c1917;--clktx:#fafaf8;--clksub:rgba(250,250,248,.6)}
.noite  {--bg:#1c1917;--bg2:#2a2520;--card:#2f2b28;--bord:#3d3830;--pri:#e85a2e;--prid:#f0a080;--pril:#e85a2e;--tx:#fafaf8;--txm:#c8c0b8;--txl:#786e68;--sage:#52b788;--sagel:#1a2e24;--gold:#f0c060;--goldl:#2a2010;--danger:#f07060;--dangerl:#2a1510;--sh:rgba(0,0,0,.3);--clkbg:#2f2b28;--clktx:#fafaf8;--clksub:rgba(250,250,248,.5)}

body{background:var(--bg)}
#app{background:var(--bg)}

/* ── BASE ───────────────────────────────────────── */
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px;-webkit-overflow-scrolling:touch;background:var(--bg)}
.card{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 2px 12px var(--sh);border:1.5px solid var(--bord);margin-bottom:11px}
.hdr{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 3px 14px var(--sh);background:var(--clkbg)}
.hdr-title{color:var(--clktx);font-size:17px;font-weight:700;text-align:center;flex:1;font-family:'Fraunces',Georgia,serif}
.back-btn{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:14px;padding:8px 13px;border-radius:11px;cursor:pointer;font-family:inherit;font-weight:600}
.nav{display:flex;background:var(--card);border-top:1.5px solid var(--bord);padding:7px 0 4px;flex-shrink:0;box-shadow:0 -2px 10px var(--sh)}
.nav-item{flex:1;text-align:center;cursor:pointer;padding:4px 2px;border-radius:10px;transition:background .2s}
.nav-icon{font-size:20px;display:block}
.nav-lbl{font-size:10px;color:var(--txl);margin-top:2px;display:block;font-family:'Nunito',system-ui,sans-serif}
.nav-item.on .nav-lbl{color:var(--pri);font-weight:700}
.nav-item.on{background:rgba(74,159,212,.1)}

/* ── RELÓGIO ────────────────────────────────────── */
.clk{border-radius:20px;padding:20px 16px;text-align:center;margin-bottom:14px;box-shadow:0 4px 20px var(--sh);background:var(--clkbg)}
.clk-time{font-size:76px;font-weight:900;color:var(--clktx);line-height:1;letter-spacing:3px;font-family:'Fraunces',Georgia,serif}
.clk-wd{font-size:19px;color:var(--clksub);margin-top:5px;font-family:'Nunito',system-ui,sans-serif}
.clk-date{font-size:14px;color:var(--clksub);margin-top:2px;opacity:.88}
.clk-season{margin-top:8px;font-size:20px;color:var(--clktx)}
.clk-mode-badge{margin-top:6px;font-size:12px;color:var(--clksub);opacity:.8}

/* ── BUTTONS ────────────────────────────────────── */
.btn-pri{background:var(--pri);border:none;border-radius:13px;padding:14px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 3px 12px var(--sh);font-family:'Nunito',system-ui,sans-serif;margin-bottom:10px}
.btn-sec{background:transparent;border:1.5px solid var(--bord);border-radius:11px;padding:9px 14px;font-size:14px;font-weight:600;color:var(--txm);cursor:pointer;font-family:'Nunito',system-ui,sans-serif}
.btn-tile{border-radius:17px;padding:18px 12px;text-align:center;cursor:pointer;border:1.5px solid var(--bord);box-shadow:0 3px 10px var(--sh);transition:transform .12s;background:var(--card)}
.btn-tile:active{transform:scale(.97)}

/* ── FORMS ──────────────────────────────────────── */
input,select,textarea{font-family:'Nunito',inherit;font-size:16px;color:var(--tx);border:1.5px solid var(--bord);border-radius:11px;padding:9px 12px;width:100%;outline:none;background:var(--card);box-sizing:border-box}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
textarea{resize:none}
.lbl{font-size:12px;color:var(--txl);font-weight:600;margin-bottom:4px;display:block;font-family:'Nunito',system-ui,sans-serif}

/* ── MISC ───────────────────────────────────────── */
.sec-title{font-size:14px;font-weight:700;color:var(--prid);margin-bottom:9px;font-family:'Fraunces',Georgia,serif}
.badge{display:inline-flex;align-items:center;border-radius:7px;padding:2px 8px;font-size:11px;font-weight:700;border:1px solid;margin:2px}
.good{color:#1a9e5c;background:#dcfce7;border-color:#1a9e5c44}
.warn{color:#d97706;background:#fef3c7;border-color:#d9770644}
.alert{color:#dc2626;background:#fee2e2;border-color:#dc262644}
.neutral{color:var(--txl);background:var(--bg2);border-color:var(--bord)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:11px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--card);border-radius:13px;padding:10px 8px;text-align:center;border:1.5px solid var(--bord);box-shadow:0 2px 6px var(--sh)}
.stat-v{font-size:14px;font-weight:700;color:var(--prid);display:block;font-family:'Fraunces',Georgia,serif}
.stat-l{font-size:10px;color:var(--txl);margin-top:2px;display:block}
.modal{position:fixed;inset:0;background:rgba(0,10,30,.72);z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px}
.modal-box{background:var(--card);border-radius:22px;padding:22px 18px;width:100%;max-width:320px;box-shadow:0 8px 40px rgba(0,0,0,.4)}
.progress{background:var(--bord);border-radius:20px;height:9px;overflow:hidden;margin-top:5px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--pri),var(--sage));border-radius:20px;transition:width .4s}
.tabs{display:flex;overflow-x:auto;gap:6px;padding:8px 12px 0;background:var(--card);border-bottom:1px solid var(--bord);flex-shrink:0}
.tab-btn{padding:8px 12px;font-size:12px;font-weight:600;border-radius:9px;cursor:pointer;border:1.5px solid var(--bord);white-space:nowrap;background:transparent;color:var(--txm);font-family:'Nunito',system-ui,sans-serif;flex-shrink:0;margin-bottom:8px}
.tab-btn.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.param-card{background:var(--card);border-radius:14px;padding:12px 10px;cursor:pointer;text-align:center;border:2px solid var(--bord);box-shadow:0 2px 8px var(--sh);transition:border-color .15s}
.pin-btn{padding:15px;font-size:20px;border-radius:12px;border:1.5px solid var(--bord);background:var(--card);cursor:pointer;font-weight:700;color:var(--tx);font-family:inherit}
.alarm-overlay{position:fixed;inset:0;background:rgba(0,10,30,.82);z-index:9998;display:flex;align-items:center;justify-content:center;padding:18px}
.toggle-sw{width:48px;height:26px;border-radius:13px;position:relative;cursor:pointer;transition:background .3s;flex-shrink:0}
.toggle-knob{position:absolute;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .3s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.check-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--bord);cursor:pointer}
.check-row:last-child{border-bottom:none}
.reading-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--bg2);font-size:13px}
.reading-row:last-child{border-bottom:none}
.alert-box{border-radius:12px;padding:9px 13px;margin-bottom:7px;display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--pri);opacity:.4;border-radius:4px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

.login-wrap{position:fixed;inset:0;background:#1c1917!important;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100000;padding:28px;overflow-y:auto}
.login-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:28px 22px;width:100%;max-width:340px}
.login-inp{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);border-radius:10px;padding:14px 16px;font-size:16px;color:#fff;width:100%;outline:none;font-family:'Nunito',system-ui,sans-serif;box-sizing:border-box;margin-bottom:10px;display:block}
.login-inp::placeholder{color:rgba(255,255,255,.35);font-size:14px}
.login-inp:focus{border-color:#e85a2e;background:rgba(255,255,255,.12)}
.login-btn{width:100%;background:#fff;border:none;border-radius:10px;padding:15px;font-size:15px;font-weight:700;color:#1c1917;cursor:pointer;margin-top:6px;font-family:'Nunito',system-ui,sans-serif;letter-spacing:.3px}
.login-err{color:#fca5a5;font-size:13px;text-align:center;margin-top:10px;display:none}
</style>

var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFtcGhkc3Z2bmRvZnFtdHRwamRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5NjU0NDIsImV4cCI6MjA5NTU0MTQ0Mn0.TCH0Qz-qqVtOj6M6q9wkCJGoIPXnm5qwbPrGMS7mZfM';

// Safe storage helpers (sessionStorage can fail in some contexts)
function ssGet(k){ try { return sessionStorage.getItem(k); } catch(e){ return window._ssFallback && window._ssFallback[k] || null; } }
function ssSet(k,v){ try { sessionStorage.setItem(k,v); } catch(e){ window._ssFallback=window._ssFallback||{}; window._ssFallback[k]=v; } }
function ssDel(k){ try { sessionStorage.removeItem(k); } catch(e){ if(window._ssFallback) delete window._ssFallback[k]; } }

var _supa = null;
var _utenteId = null;
var _syncQueue = [];
var _isOnline = navigator.onLine;

function initSupabase(){
  if(SUPA_URL === 'COLOCA_AQUI_O_PROJECT_URL') return;
  function tryInit(attempts){
    if(attempts <= 0){ console.warn('Supabase SDK not loaded'); return; }
    if(typeof supabase !== 'undefined' && supabase.createClient){
      try {
        _supa = supabase.createClient(SUPA_URL, SUPA_KEY);
        window.addEventListener('online',  function(){ _isOnline=true;  flushQueue(); });
        window.addEventListener('offline', function(){ _isOnline=false; });
        // Quando o utilizador chega pelo link do email de recuperação
        _supa.auth.onAuthStateChange(function(event){
          if(event==='PASSWORD_RECOVERY'){
            if(typeof showNewPassword==='function') showNewPassword();
          }
        });
        console.log('Supabase ready');
        // carregar configurações da app (ex: PIN padrão)
        if(typeof loadAppSettings==='function') loadAppSettings().catch(()=>{});
        // atualizar saudação se já tivermos perfil carregado
        if(typeof updateGreeting==='function') updateGreeting();
      } catch(e){ console.warn('Supabase init error:', e); }
    } else {
      setTimeout(function(){ tryInit(attempts-1); }, 500);
    }
  }
  tryInit(10);
}

// ── AUTH ─────────────────────────────────────────────────────────
async function supaLogin(email, password){
  if(!_supa) return {error:'Supabase não configurado'};
  try {
    var r = await _supa.auth.signInWithPassword({email: email, password: password});
    if(r.error) return {error: r.error.message || 'Erro de ligação.'};
  // Carregar dados do utente
  var {data} = await _supa.from('utentes').select('*').eq('email', email).single();
  if(data) {
    _utenteId = data.id;
    mergeProfileFromSupa(data);
  }
  return {ok: true};
  } catch(e){ return {error: 'Erro de ligação: '+(e.message||'sem internet')}; }
}

async function supaLogout(){
  if(_supa) await _supa.auth.signOut();
  _utenteId = null;
  ssDel('mv_auth');
  ssDel('mv_supa_email');
}

// ── RECUPERAÇÃO DE PASSWORD ──────────────────────────────────────
async function supaResetRequest(email){
  if(!_supa) return {error:'Supabase não configurado'};
  try {
    var r = await _supa.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
    if(r.error) return {error: r.error.message || 'Não foi possível enviar o email.'};
    return {ok:true};
  } catch(e){ return {error:'Erro de ligação: '+(e.message||'sem internet')}; }
}
async function supaSetNewPassword(newPass){
  if(!_supa) return {error:'Supabase não configurado'};
  try {
    var r = await _supa.auth.updateUser({ password: newPass });
    if(r.error) return {error: r.error.message || 'Não foi possível alterar a password.'};
    return {ok:true};
  } catch(e){ return {error:'Erro de ligação: '+(e.message||'sem internet')}; }
}

async function supaRegister(email, password, name){
  if(!_supa) return {error:'Supabase não configurado'};
  // Criar auth user
  var r = await _supa.auth.signUp({email, password});
  if(r.error) return {error: r.error.message};
  // Criar perfil do utente
  var {data, error} = await _supa.from('utentes').insert({email, name}).select().single();
  if(error) return {error: error.message};
  _utenteId = data.id;
  return {ok: true};
}

// ── SYNC ─────────────────────────────────────────────────────────
function queueSync(fn){ 
  _syncQueue.push(fn);
  if(_isOnline) flushQueue();
}

async function flushQueue(){
  while(_syncQueue.length > 0 && _isOnline){
    var fn = _syncQueue.shift();
    try { await fn(); } catch(e){ _syncQueue.unshift(fn); break; }
  }
}

// ── SAVE/LOAD com sync ────────────────────────────────────────────
var _origSaveDB = null;
function wrapSaveDB(){
  _origSaveDB = window.saveDB;
  window.saveDB = function(){
    if(typeof _origSaveDB==='function') _origSaveDB();
    if(_utenteId) queueSync(pushToSupa);
  };
}

async function pushToSupa(){
  if(!_supa || !_utenteId) return;
  // Sincronizar perfil
  if(DB.profile){
    await _supa.from('utentes').update({
      name: DB.profile.name,
      dob: DB.profile.dob || null,
      gender: DB.profile.gender || 'F',
      nhc: DB.profile.nhc || null,
      cc: DB.profile.cc || null,
      nif: DB.profile.nif || null,
      phone: DB.profile.phone || null,
      address: DB.profile.address || null,
      city: DB.profile.city || null,
      conditions: DB.profile.conditions || null,
      allergies: DB.profile.allergies || null,
      meds_notes: DB.profile.meds || null,
      urgent_notes: DB.profile.urgent_notes || null,
      doctor: DB.profile.doctor || null,
      doctor_phone: DB.profile.doctorPhone || null,
      hospital: DB.profile.hospital || null,
      emerg_contact: DB.profile.emergContact || null,
      emerg_phone: DB.profile.emergPhone || null,
      caregiver_name: DB.profile.caregiver_name || null,
      caregiver_phone: DB.profile.caregiver_phone || null,
      mode: DB.mode || 'saude',
      params: DB.params || {},
      updated_at: new Date().toISOString()
    }).eq('id', _utenteId);
  }
  // Sincronizar registos de hoje
  var today = new Date().toISOString().slice(0,10);
  if(DB.records && DB.records[today]){
    var r = DB.records[today];
    await _supa.from('health_records').upsert({
      utente_id: _utenteId,
      date: today,
      tensao: r.tensao || [],
      glicemia: r.glicemia || [],
      fc: r.fc || null,
      peso: r.peso || null,
      temperatura: r.temperatura || null,
      spo2: r.spo2 || null,
      dor: r.dor || null,
      humor: r.humor || null,
      apetite: r.apetite || null,
      agua: r.agua || 0,
      sono: r.sono || null,
      evacuacao: r.evacuacao || null,
      exercicio: r.exercicio || null,
      quedas: r.quedas || 0,
      refeicoes: r.refeicoes || {},
      notas: r.notas || null,
      registado_por: r.registadoPor || 'cuidadora',
      updated_at: new Date().toISOString()
    }, {onConflict: 'utente_id,date'});
  }
  // Sincronizar medicamentos
  if(DB.medications){
    for(var m of DB.medications){
      await _supa.from('medications').upsert({
        id: m.id,
        utente_id: _utenteId,
        name: m.name,
        dose: m.dose || null,
        via: m.via || 'oral',
        refeicao: m.refeicao || 'sem indicação',
        times: m.times || [],
        notes: m.notes || null,
        active: m.active !== false
      }, {onConflict: 'id'});
    }
  }
}

async function pullFromSupa(){
  if(!_supa || !_utenteId) return;
  // Buscar todos os registos dos últimos 365 dias
  var cutoff = new Date();
  cutoff.setFullYear(cutoff.getFullYear() - 1);
  var {data: records} = await _supa.from('health_records')
    .select('*')
    .eq('utente_id', _utenteId)
    .gte('date', cutoff.toISOString().slice(0,10));
  if(records){
    if(!DB.records) DB.records = {};
    records.forEach(function(r){
      DB.records[r.date] = {
        tensao: r.tensao || [],
        glicemia: r.glicemia || [],
        fc: r.fc, peso: r.peso, temperatura: r.temperatura,
        spo2: r.spo2, dor: r.dor, humor: r.humor, apetite: r.apetite,
        agua: r.agua || 0, sono: r.sono, evacuacao: r.evacuacao,
        exercicio: r.exercicio || '', quedas: r.quedas || 0,
        refeicoes: r.refeicoes || {}, notas: r.notas || '',
        registadoPor: r.registado_por || 'cuidadora',
        medTaken: DB.records[r.date]?.medTaken || {}
      };
    });
  }
  // Buscar medicamentos
  var {data: meds} = await _supa.from('medications')
    .select('*').eq('utente_id', _utenteId);
  if(meds) DB.medications = meds.map(function(m){
    return {id:m.id, name:m.name, dose:m.dose, via:m.via,
            refeicao:m.refeicao, times:m.times||[], notes:m.notes,
            active:m.active !== false};
  });
  // Buscar contactos
  var {data: contacts} = await _supa.from('contacts')
    .select('*').eq('utente_id', _utenteId).order('order_index');
  if(contacts) DB.contacts = contacts.map(function(c){
    return {name:c.name, role:c.role, phone:c.phone, email:c.email,
            notes:c.notes, color:c.color, photo:c.photo_url};
  });
  safeSave();
}

function safeSave(){ if(typeof _origSaveDB==='function') safeSave(); else if(typeof saveDB==='function') saveDB(); }
function mergeProfileFromSupa(data){
  if(!DB.profile) DB.profile = {};
  var p = DB.profile;
  p.name = data.name || p.name;
  p.dob = data.dob || p.dob;
  p.gender = data.gender || p.gender;
  p.nhc = data.nhc || p.nhc;
  p.cc = data.cc || p.cc;
  p.nif = data.nif || p.nif;
  p.phone = data.phone || p.phone;
  p.address = data.address || p.address;
  p.city = data.city || p.city;
  p.conditions = data.conditions || p.conditions;
  p.allergies = data.allergies || p.allergies;
  p.meds = data.meds_notes || p.meds;
  p.urgent_notes = data.urgent_notes || p.urgent_notes;
  p.doctor = data.doctor || p.doctor;
  p.doctorPhone = data.doctor_phone || p.doctorPhone;
  p.hospital = data.hospital || p.hospital;
  p.emergContact = data.emerg_contact || p.emergContact;
  p.emergPhone = data.emerg_phone || p.emergPhone;
  p.caregiver_name = data.caregiver_name || p.caregiver_name;
  p.caregiver_phone = data.caregiver_phone || p.caregiver_phone;
  DB.mode = data.mode || DB.mode;
  DB.params = data.params || DB.params;
  safeSave();
  // atualizar saudação com o nome do utente quando o perfil é mesclado
  if(typeof updateGreeting==='function') updateGreeting();
}

<script>

// ════════════════════════════════════════════════════════

const WDF=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const MS=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MF=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const SEASONS=[
  {n:'Inverno',e:'&#10052;&#65039;',m:[12,1,2],frase:'As noites são longas e o frio convida a ficar quentinho em casa.'},
  {n:'Primavera',e:'&#127800;',m:[3,4,5],frase:'A natureza renasce — é a estação das flores e dos dias mais longos.'},
  {n:'Verão',e:'&#9728;&#65039;',m:[6,7,8],frase:'Os dias são quentes e longos. Hidrate-se bem e evite o sol nas horas mais quentes.'},

function getSeason(mon){return SEASONS.find(s=>s.m.includes(mon))||SEASONS[0]}
function todayKey(){return new Date().toISOString().slice(0,10)}
function fmtS(s){try{const d=new Date(s+'T12:00');return d.getDate()+' '+MS[d.getMonth()]}catch{return s}}
function fmtF(s){try{const d=new Date(s+'T12:00');return WDF[d.getDay()]+', '+d.getDate()+' de '+MF[d.getMonth()]+' de '+d.getFullYear()}catch{return s}}
function nowTime(){const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function pad(n){return String(n).padStart(2,'0')}
function getLast(n){const a=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push(d.toISOString().slice(0,10))}return a}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function clf(pid,val){
  const v=parseFloat(val);if(isNaN(v))return'neutral';
  const R={tensao_s:{g:[90,119],w:[120,139]},tensao_d:{g:[60,79],w:[80,89]},glicemia:{g:[70,100],w:[101,125]},
    fc:{g:[60,100],w:[51,59]},temperatura:{g:[36.0,37.2],w:[37.3,37.9]},spo2:{g:[95,100],w:[90,94]}};
  const r=R[pid];if(!r)return'neutral';
  if(v>=r.g[0]&&v<=r.g[1])return'good';
  if(r.w&&v>=r.w[0]&&v<=r.w[1])return'warn';return'alert';
}
const CLRMAP={good:'#1a9e5c',warn:'#d97706',alert:'#dc2626',neutral:'var(--txl)'};

function getMode(){const h=new Date().getHours();return h>=6&&h<13?'manha':h>=13&&h<20?'tarde':'noite'}

}

function greet(){const h=new Date().getHours();return h<12?'Bom dia':h<19?'Boa tarde':'Boa noite'}

}

function emptyDay(){

    agua:0,sono:null,evacuacao:null,apetite:null,quedas:0,exercicio:'',

// ── MEDICATION HELPERS ──────────────────────────────────
function getMeds(){return DB.medications||[];}
function getActiveMeds(){return getMeds().filter(m=>m.active!==false);}
function isTaken(rec,medId,timeStr){return!!(rec.medicacao?.[medId]?.times?.includes(timeStr));}
function getMedAdh(rec){
  const meds=getActiveMeds();if(!meds.length)return null;
  let total=0,done=0;
  meds.forEach(m=>{(m.times||[]).forEach(t=>{total++;if(isTaken(rec,m.id,t))done++;});});
  return{done,total};
}

function getActiveParams(){
  if(!DB.params)DB.params={};
  return ALL_PARAMS.filter(p=>{
    if(p.id in DB.params)return DB.params[p.id];
    return p.defaultOn;
  });
}
function isParamActive(id){
  if(!DB.params)DB.params={};
  if(id in DB.params)return DB.params[id];
  const p=ALL_PARAMS.find(x=>x.id===id);return p?p.defaultOn:false;
}

function homeSaude(el){
  if(!DB.profile) DB.profile={name:'Utilizador',appVersion:2};
  const rec=getToday();const active=getActiveParams();
  const name=(DB.profile?.name||'').split(' ')[0];
  const now=new Date();const m=getMode();
  const modeTips={manha:'Bom momento para registar a tensão e o peso (em jejum).',tarde:'Não se esqueça da leitura pós-refeição se for diabético.',noite:'Registe como foi o seu dia, o que comeu e como dormiu.'};

  // Build quick stats for active key params
  const lT=rec.tensao?.slice(-1)[0];const lG=rec.glicemia?.slice(-1)[0];
  const medAdh=getMedAdh(rec);
  let alertsHtml='';
  if(lT?.sistolica>160)alertsHtml+=alertBox('⚠️','Tensão muito elevada: '+lT.sistolica+'/'+lT.diastolica+' mmHg','alert');
  else if(lT?.sistolica>140)alertsHtml+=alertBox('⚡','Tensão elevada: '+lT.sistolica+'/'+lT.diastolica+' mmHg','warn');
  if(lG?.value<70)alertsHtml+=alertBox('⚠️','Glicémia baixa: '+lG.value+' mg/dL','alert');
  else if(lG?.value>200)alertsHtml+=alertBox('⚠️','Glicémia muito elevada: '+lG.value+' mg/dL','alert');
  if(rec.spo2&&rec.spo2<90)alertsHtml+=alertBox('⚠️','Saturação baixa: '+rec.spo2+'%','alert');
  if(rec.quedas>0)alertsHtml+=alertBox('⚠️','Queda registada hoje!','alert');

  // Progress: how many active params filled
  const toFill=active.filter(p=>['tensao','glicemia','fc','peso','temperatura','spo2'].includes(p.id));
  const filled=toFill.filter(p=>{
    if(p.id==='tensao')return rec.tensao?.length>0;
    if(p.id==='glicemia')return rec.glicemia?.length>0;
    return rec[p.id]!=null;
  }).length;
  const pct=toFill.length?Math.round(filled/toFill.length*100):100;

  // Key stats boxes (only show active ones)
  const quickStats=[];

function renderRegisto(el,date,isCarer){
  const rec=getDay(date);
  const active=getActiveParams();
  const lT=rec.tensao?.slice(-1)[0];const lG=rec.glicemia?.slice(-1)[0];
  function gv(pid){
    if(pid==='tensao')return lT?lT.sistolica+'/'+lT.diastolica:null;
    if(pid==='glicemia')return lG?.value??null;
    return rec[pid]??null;
  }
  function badgeFor(p){
    const v=gv(p.id);if(v===null||v===undefined)return`<div style="font-size:11px;color:var(--bord);margin-top:2px">— registar</div>`;
    const cls=p.id==='tensao'?clf('tensao_s',rec.tensao?.slice(-1)[0]?.sistolica):clf(p.id,v);
    const clr=CLRMAP[cls];
    return`<div style="font-size:14px;font-weight:700;color:${clr};font-family:'Fraunces',Georgia,serif">${v}<span style="font-size:9px;font-weight:400"> ${p.id==='tensao'?'mmHg':p.id==='glicemia'?'mg/dL':p.id==='dor'?'/10':p.id==='humor'||p.id==='apetite'?'/5':''}</span></div>`;
  }

  // Separate by category
  const vitalParams=active.filter(p=>['tensao','fc','temperatura','spo2','glicemia','peso'].includes(p.id));
  const bemParams=active.filter(p=>['dor','humor','apetite'].includes(p.id));
  const habitParams=active.filter(p=>['agua','sono','evacuacao','exercicio'].includes(p.id));
  const segParams=active.filter(p=>['quedas'].includes(p.id));
  const medParam=active.find(p=>p.id==='medicacao');

  el.innerHTML=`<div class="screen">
  ${clockHtml(true)}
  ${isCarer?`<div style="background:var(--goldl);border-radius:10px;padding:7px 13px;margin-bottom:10px;border:1px solid var(--gold)55"><span style="font-size:12px;color:var(--gold);font-weight:700;font-family:'Nunito',system-ui,sans-serif">🔑 Registo pelo Cuidador · ${date}</span></div>`:''}

  ${vitalParams.length?`<div class="sec-title">📊 Sinais Vitais</div>
  <div class="g2" style="margin-bottom:10px">
    ${vitalParams.map(p=>`<div class="param-card" onclick="openParamModal('${p.id}','${date}')" style="border-color:${gv(p.id)?CLRMAP[clf(p.id==='tensao'?'tensao_s':p.id,p.id==='tensao'?lT?.sistolica:gv(p.id))]+'66':'var(--bord)'}">
      <div style="font-size:22px;margin-bottom:2px">${p.icon}</div>
      <div style="font-size:11px;color:var(--txl);margin-bottom:2px">${p.label}</div>

  ${rec.glicemia?.length?`<div class="card" style="background:var(--bg2);margin-bottom:10px">
    <div class="sec-title" style="font-size:13px">🩸 Glicémia hoje (${rec.glicemia.length} leituras)</div>
    ${rec.glicemia.map(g=>`<div class="reading-row"><span style="color:var(--txm)">${g.time} · <em style="color:var(--txl)">${g.context}</em></span><span class="badge ${clf('glicemia',g.value)}">${g.value} mg/dL</span></div>`).join('')}
    <button onclick="openParamModal('glicemia','${date}')" style="margin-top:8px;background:transparent;border:1px solid var(--pri);border-radius:9px;padding:5px 12px;font-size:12px;color:var(--pri);cursor:pointer;font-weight:600">+ Adicionar leitura</button>
  </div>`:''}

  ${rec.tensao?.length>1?`<div class="card" style="background:var(--bg2);margin-bottom:10px">
    <div class="sec-title" style="font-size:13px">💓 Tensão hoje (${rec.tensao.length} leituras)</div>
    ${rec.tensao.map(t=>`<div class="reading-row"><span style="color:var(--txm)">${t.time||'—'}</span><span style="font-size:13px;font-weight:700;color:${t.sistolica>140?'var(--danger)':'var(--prid)'}">${t.sistolica||'?'}/${t.diastolica||'?'} mmHg</span></div>`).join('')}
    <button onclick="openParamModal('tensao','${date}')" style="margin-top:8px;background:transparent;border:1px solid var(--pri);border-radius:9px;padding:5px 12px;font-size:12px;color:var(--pri);cursor:pointer;font-weight:600">+ Adicionar leitura</button>
  </div>`:''}

  ${bemParams.length?`<div class="sec-title">🌡️ Bem-estar</div>
  <div class="g2" style="margin-bottom:10px">
    ${bemParams.map(p=>`<div class="param-card" onclick="openParamModal('${p.id}','${date}')" style="border-color:${gv(p.id)!=null?'var(--pri)44':'var(--bord)'}">
      <div style="font-size:22px;margin-bottom:2px">${p.icon}</div>
      <div style="font-size:11px;color:var(--txl);margin-bottom:2px">${p.label}</div>
      ${badgeFor(p)}</div>`).join('')}
  </div>`:''}

  ${habitParams.length?`<div class="sec-title">🌿 Hábitos Diários</div>
  ${buildHabitInputs(rec,date,habitParams)}`:''}

  ${segParams.length?`<div class="sec-title">⚠️ Segurança</div>
  <div class="card" style="margin-bottom:11px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div><div style="font-size:15px;font-weight:700;color:var(--prid);font-family:'Fraunces',Georgia,serif">⚠️ Quedas hoje</div><div style="font-size:12px;color:var(--txl);margin-top:2px">Registe sempre que ocorrer uma queda</div></div>
      <div style="display:flex;align-items:center;gap:10px">
        <button onclick="adjQueda(-1,'${date}')" style="background:var(--bg2);border:none;border-radius:8px;padding:6px 10px;font-size:16px;cursor:pointer;color:var(--txm)">−</button>

        <button onclick="adjQueda(1,'${date}')" style="background:var(--dangerl);border:none;border-radius:8px;padding:6px 10px;font-size:16px;cursor:pointer;color:var(--danger)">+</button>
      </div>
    </div>
  </div>`:''}

  ${(()=>{
    const meds=getActiveMeds();
    if(!isParamActive('medicacao'))return'';
    if(!meds.length)return`<div class="sec-title">💊 Medicação</div>
    <div class="card" style="background:rgba(217,119,6,.07);border-color:var(--gold)44;margin-bottom:11px">
      <div style="font-size:14px;font-weight:700;color:var(--gold);font-family:'Fraunces',Georgia,serif;margin-bottom:4px">💊 Sem medicação configurada</div>
      <div style="font-size:13px;color:var(--txm);font-family:'Nunito',system-ui,sans-serif">Configure em <strong>Cuidador → Medicação</strong>.</div>
    </div>`;
    const adh=getMedAdh(rec);
    const adhPct=adh&&adh.total?Math.round(adh.done/adh.total*100):0;
    return`<div class="sec-title">💊 Medicação</div>
    ${adh&&adh.total>0?`<div class="card" style="padding:11px 14px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span style="font-size:13px;color:var(--txm);font-weight:600">${adh.done}/${adh.total} tomas confirmadas</span>
        <span style="font-size:14px;font-weight:700;color:${adhPct===100?'var(--sage)':adhPct>0?'var(--gold)':'var(--txl)'}">${adhPct}%</span>
      </div>
      <div class="progress"><div class="progress-fill" style="width:${adhPct}%;background:${adhPct===100?'var(--sage)':'linear-gradient(90deg,var(--pri),var(--sage))'}"></div></div>
      ${adhPct===100?`<div style="font-size:12px;color:var(--sage);margin-top:6px;font-weight:600;font-family:'Nunito',system-ui,sans-serif">✅ Toda a medicação tomada!</div>`:''}
    </div>`:''}
    ${meds.map(m=>{
      const allOk=(m.times||[]).length>0&&(m.times||[]).every(t=>isTaken(rec,m.id,t));
      return`<div class="card" style="margin-bottom:10px;border-color:${allOk?'var(--sage)44':'var(--bord)'}">
        <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:10px">
          <div style="width:40px;height:40px;border-radius:10px;background:${allOk?'rgba(26,158,92,.15)':'rgba(26,106,173,.1)'};display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">💊</div>
          <div style="flex:1">
            <div style="font-size:15px;font-weight:700;color:var(--prid);font-family:'Fraunces',Georgia,serif">${esc(m.name)}</div>
            ${m.dose?`<div style="font-size:12px;color:var(--txm);margin-top:1px">${esc(m.dose)}${m.via?' · '+esc(m.via):''}</div>`:''}
            ${m.refeicao&&m.refeicao!=='sem indicação'?`<div style="font-size:11px;color:var(--txl);margin-top:1px">🍽️ ${esc(m.refeicao)}</div>`:''}
            ${m.notes?`<div style="font-size:11px;color:var(--txl);margin-top:1px;font-style:italic">${esc(m.notes)}</div>`:''}
          </div>
          ${allOk?`<span style="font-size:20px">✅</span>`:''}
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:7px">
          ${(m.times||[]).map(t=>{
            const ok=isTaken(rec,m.id,t);
            const ts=rec.medicacao?.[m.id]?.stamps?.[t];
            return`<button onclick="takeMed('${m.id}','${t}','${date}')" style="display:flex;align-items:center;gap:6px;padding:9px 13px;border-radius:11px;border:2px solid ${ok?'var(--sage)':'var(--bord)'};background:${ok?'rgba(26,158,92,.1)':'var(--bg2)'};cursor:pointer;font-family:'Nunito',system-ui,sans-serif;font-size:13px;font-weight:700;color:${ok?'var(--sage)':'var(--txm)'};transition:all .2s">
              <span style="font-size:15px">${ok?'✅':'⏰'}</span>
              <div style="text-align:left"><div>${t}</div>${ok&&ts?`<div style="font-size:10px;font-weight:400;color:var(--sage)">tomado ${ts}</div>`:''}${!ok?`<div style="font-size:10px;font-weight:400;color:var(--txl)">por confirmar</div>`:''}</div>
            </button>`;
          }).join('')}
        </div>
      </div>`;
    }).join('')}`;
  })()}

  <div class="sec-title">📝 Observações</div>
  <div class="card"><textarea rows="3" placeholder="Sintomas, queixas, observações..." oninput="saveNotas(this.value,'${date}')">${esc(rec.notas||'')}</textarea></div>
  </div>`;
}

function buildHabitInputs(rec,date,params){
  let html='';
  params.forEach(p=>{
    if(p.id==='agua'){html+=`<div class="card" style="margin-bottom:10px;padding:12px 14px">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div><div style="font-size:14px;font-weight:700;color:var(--prid);font-family:'Fraunces',Georgia,serif">💧 Água hoje</div><div style="font-size:11px;color:var(--txl);margin-top:1px">Meta: 6–8 copos · Idosos desidratam facilmente</div></div>
        <div style="display:flex;align-items:center;gap:8px">
          <button onclick="adjAgua(-1,'${date}')" style="background:var(--dangerl);border:none;border-radius:8px;padding:6px 10px;font-size:16px;cursor:pointer;color:var(--danger)">−</button>
          <span id="agua-v" style="font-size:20px;font-weight:700;color:var(--pri);min-width:18px;text-align:center;font-family:'Fraunces',Georgia,serif">${rec.agua||0}</span>
          <button onclick="adjAgua(1,'${date}')" style="background:rgba(26,106,173,.1);border:none;border-radius:8px;padding:6px 10px;font-size:16px;cursor:pointer;color:var(--pri)">+</button>
        </div>
      </div>
      ${(rec.agua||0)>=6?`<div style="font-size:11px;color:var(--sage);margin-top:6px;font-weight:600">✅ Objetivo de hidratação atingido!</div>`:''}
    </div>`;}
    else if(p.id==='sono'){html+=`<div class="card" style="margin-bottom:10px;padding:12px 14px">
      <div style="font-size:14px;font-weight:700;color:var(--prid);font-family:'Fraunces',Georgia,serif;margin-bottom:7px">🛏️ Sono esta noite</div>
      <div style="display:flex;align-items:center;gap:10px">
        <input type="number" value="${rec.sono||''}" min="0" max="24" step="0.5" placeholder="Ex: 7.5"
          style="flex:1;text-align:center;font-size:18px;font-weight:700;font-family:'Fraunces',Georgia,serif;padding:8px"
          oninput="saveSono(this.value,'${date}')">
        <span style="font-size:14px;color:var(--txl)">horas</span>
      </div>
    </div>`;}
    else if(p.id==='evacuacao'){html+=`<div class="card" style="margin-bottom:10px;padding:12px 14px">
      <div style="font-size:14px;font-weight:700;color:var(--prid);font-family:'Fraunces',Georgia,serif;margin-bottom:7px">🚽 Intestino hoje</div>
      <div style="display:flex;gap:7px;flex-wrap:wrap">
        ${['Normal','Obstipação','Diarreia','Não evacuou'].map(o=>`<button onclick="saveEvacuacao('${o}','${date}')" style="padding:8px 12px;font-size:12px;font-weight:600;border-radius:9px;cursor:pointer;font-family:'Nunito',system-ui,sans-serif;border:1.5px solid ${rec.evacuacao===o?'var(--pri)':'var(--bord)'};background:${rec.evacuacao===o?'var(--pri)':'transparent'};color:${rec.evacuacao===o?'#fff':'var(--txm)'}">${o}</button>`).join('')}
      </div>
    </div>`;}
    else if(p.id==='exercicio'){html+=`<div class="card" style="margin-bottom:10px">
      <div style="font-size:14px;font-weight:700;color:var(--prid);font-family:'Fraunces',Georgia,serif;margin-bottom:7px">🏃 Atividade física hoje</div>

    </div>`;}
  });

window.adjAgua=function(d,date){const r=getDay(date);r.agua=Math.max(0,Math.min(15,(r.agua||0)+d));setDay(date,r);const v=document.getElementById('agua-v');if(v)v.textContent=r.agua;}
window.adjQueda=function(d,date){const r=getDay(date);r.quedas=Math.max(0,(r.quedas||0)+d);setDay(date,r);const v=document.getElementById('queda-v');if(v){v.textContent=r.quedas;v.style.color=r.quedas>0?'var(--danger)':'var(--txl)';}}
window.saveSono=function(v,d){const r=getDay(d);r.sono=parseFloat(v)||null;setDay(d,r);}
window.saveNotas=function(v,d){const r=getDay(d);r.notas=v;setDay(d,r);}
window.saveExerc=function(v,d){const r=getDay(d);r.exercicio=v;setDay(d,r);}
window.saveEvacuacao=function(v,d){
  const r=getDay(d);r.evacuacao=v;setDay(d,r);
  const el=document.getElementById('content');
  if(CS==='registo')renderRegisto(el,d,false);
  else if(CS==='reg_carer')renderRegisto(el,d,true);
  else render(); // re-render whatever screen is active
  // Update button states immediately without full re-render
  document.querySelectorAll('[data-evac]').forEach(function(btn){
    const selected=btn.dataset.evac===v;
    btn.style.background=selected?'var(--pri)':'transparent';

function buildChart(allVals,cfg,maxPts){
  const pts=allVals.length>maxPts?allVals.filter((_,i)=>i%Math.ceil(allVals.length/maxPts)===0||i===allVals.length-1):allVals;
  const W=440,H=160,PL=36,PR=16,PB=28,PT=8;const cW=W-PL-PR,cH=H-PT-PB;
  const ys=pts.map(p=>p.v);const rv=cfg.refs.map(r=>r.y);const allV=[...ys,...rv];
  const raw0=Math.min(...allV),raw1=Math.max(...allV);const pd=(raw1-raw0)*.15||5;
  const y0=raw0-pd,y1=raw1+pd;
  const xS=i=>(i/(pts.length-1||1))*cW+PL;const yS=v=>H-PB-((v-y0)/(y1-y0))*cH;
  const poly=pts.map((p,i)=>`${xS(i)},${yS(p.v)}`).join(' ');
  const area=`${PL},${H-PB} `+pts.map((p,i)=>`${xS(i)},${yS(p.v)}`).join(' ')+` ${xS(pts.length-1)},${H-PB}`;
  const dS=Math.ceil(pts.length/8);
  const dots=pts.filter((_,i)=>i%dS===0||i===pts.length-1).map(p=>`<circle cx="${xS(pts.indexOf(p))}" cy="${yS(p.v)}" r="3" fill="${cfg.color}"/>`).join('');
  const xL=pts.filter((_,i)=>i%Math.ceil(pts.length/5)===0||i===pts.length-1).map(p=>`<text x="${xS(pts.indexOf(p))}" y="${H-PB+13}" text-anchor="middle" font-size="8" fill="var(--txl)">${fmtS(p.date)}</text>`).join('');

window.doExcel=function(){

  else load();
}
function buildXLS(allD){
  const wb=XLSX.utils.book_new();
  const r1=[['Data','Dia','T.Sist.','T.Diast.','Gli.Méd.','FC','Peso','Temp','SpO₂','Água','Sono','Intestino','Quedas','Med.OK','Exercício','P.Almoço','Almoço','Lanche','Jantar','Observações','Registado por']];
  allD.forEach(d=>{const r=DB.records?.[d];if(!r)return;
    const gAvg=r.glicemia?.length?Math.round(r.glicemia.reduce((a,b)=>a+b.value,0)/r.glicemia.length):null;
    const t=r.tensao?.slice(-1)[0];const dd=new Date(d+'T12:00');
    r1.push([d,WDF[dd.getDay()],t?.sistolica,t?.diastolica,gAvg,r.fc,r.peso,r.temperatura,r.spo2,r.agua,r.sono,r.evacuacao,r.quedas,(()=>{const a=getMedAdh(r);return a?a.done+'/'+a.total:'—';})(),r.exercicio,r.refeicoes?.breakfast,r.refeicoes?.lunch,r.refeicoes?.snack,r.refeicoes?.dinner,r.notas,r.registadoPor]);});
  const ws1=XLSX.utils.aoa_to_sheet(r1);
  XLSX.utils.book_append_sheet(wb,ws1,'Registos Diários');
  // glicemia detail
  const gr=[['Data','Hora','Valor mg/dL','Contexto','Avaliação']];
  allD.forEach(d=>{DB.records?.[d]?.glicemia?.forEach(g=>{const s=clf('glicemia',g.value);gr.push([d,g.time,g.value,g.context,s==='good'?'Normal':s==='warn'?'Atenção':'Elevado/Baixo']);});});
  if(gr.length>1)XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(gr),'Glicémia Detalhada');
  // tensão detail
  const tr=[['Data','Hora','Sistólica','Diastólica','Avaliação']];
  allD.forEach(d=>{DB.records?.[d]?.tensao?.forEach(t=>{const s=clf('tensao_s',t.sistolica);tr.push([d,t.time,t.sistolica,t.diastolica,s==='good'?'Normal':s==='warn'?'HTA grau 1':'HTA grau 2+']);});});
  if(tr.length>1)XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(tr),'Tensão Detalhada');
  // stats
  const allG=[].concat(...allD.map(d=>DB.records?.[d]?.glicemia?.map(g=>g.value)||[]));
  const allS=allD.map(d=>DB.records?.[d]?.tensao?.slice(-1)[0]?.sistolica).filter(Boolean);
  const allDi=allD.map(d=>DB.records?.[d]?.tensao?.slice(-1)[0]?.diastolica).filter(Boolean);
  const allP=allD.map(d=>DB.records?.[d]?.peso).filter(Boolean);
  const s=[['RELATÓRIO — Memória Viva · DAR+'],[''],
    ['Utente:',DB.profile?.name||'—'],['Nascimento:',DB.profile?.dob||'—'],
    ['Período:',fmtS(allD[0])+' a '+fmtS(allD[allD.length-1])],['Gerado:',new Date().toLocaleDateString('pt-PT')+' '+nowTime()]];
  if(DB.profile?.reporter_name){
    s.push(['Preenchido por:',DB.profile.reporter_name+(DB.profile.reporter_role?' ('+DB.profile.reporter_role+')':'')]);
    if(DB.profile.reporter_phone)s.push(['Contacto:',DB.profile.reporter_phone]);
  }
  s.push([''],
    ['Parâmetro','Média','Mínimo','Máximo','Nº leituras','Referência Normal'],
    ['Tensão Sist.(mmHg)',allS.length?Math.round(allS.reduce((a,b)=>a+b)/allS.length):'-',allS.length?Math.min(...allS):'-',allS.length?Math.max(...allS):'-',allS.length,'<120 mmHg'],
    ['Tensão Diast.(mmHg)',allDi.length?Math.round(allDi.reduce((a,b)=>a+b)/allDi.length):'-',allDi.length?Math.min(...allDi):'-',allDi.length?Math.max(...allDi):'-',allDi.length,'<80 mmHg'],
    ['Glicémia (mg/dL)',allG.length?Math.round(allG.reduce((a,b)=>a+b)/allG.length):'-',allG.length?Math.min(...allG):'-',allG.length?Math.max(...allG):'-',allG.length,'70–100 (jejum)'],
    ['Peso (kg)',allP.length?Math.round(allP.reduce((a,b)=>a+b)/allP.length*10)/10:'-',allP.length?Math.min(...allP):'-',allP.length?Math.max(...allP):'-',allP.length,'—'],[''],
    ['Taxa de adesão:',Math.round(allD.filter(d=>{const r=DB.records?.[d];return r&&(r.tensao?.length||r.glicemia?.length||r.peso);}).length/allD.length*100)+'%'],[''],
    ['Memória Viva · DAR+ · www.darmais.pt · geral@darmais.pt'],['acompanhando e prevenindo para a vida']);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s),'Estatísticas');
  XLSX.writeFile(wb,'MemoriaViva_'+(DB.profile?.name||'').replace(/\s/g,'_')+'_'+todayKey()+'.xlsx');
}
window.doText=function(){
  const dN=_rp==='7d'?7:_rp==='30d'?30:_rp==='3m'?90:_rp==='6m'?180:365;const allD=getLast(dN);
  const allG=[].concat(...allD.map(d=>DB.records?.[d]?.glicemia?.map(g=>g.value)||[]));
  const allS=allD.map(d=>DB.records?.[d]?.tensao?.slice(-1)[0]?.sistolica).filter(Boolean);
  const allDi=allD.map(d=>DB.records?.[d]?.tensao?.slice(-1)[0]?.diastolica).filter(Boolean);
  const recN=allD.filter(d=>{const r=DB.records?.[d];return r&&(r.tensao?.length||r.glicemia?.length||r.peso);}).length;
  const L=['══════════════════════════════','MEMÓRIA VIVA · DAR+','RELATÓRIO DE SAÚDE','══════════════════════════════','',
    'Utente: '+(DB.profile?.name||'—'),'Nascimento: '+(DB.profile?.dob||'—'),
    'Período: '+fmtS(allD[0])+' a '+fmtS(allD[allD.length-1]),'Gerado: '+new Date().toLocaleDateString('pt-PT')+' '+nowTime(),''];
  if(DB.profile?.reporter_name){
    L.push('Preenchido por: '+DB.profile.reporter_name+(DB.profile.reporter_role?' ('+DB.profile.reporter_role+')':''));
    if(DB.profile.reporter_phone)L.push('Contacto: '+DB.profile.reporter_phone);
    L.push('');
  }
  L.push('── RESUMO ESTATÍSTICO ──────────','');
  if(allS.length)L.push('Tensão: média '+Math.round(allS.reduce((a,b)=>a+b)/allS.length)+'/'+Math.round(allDi.reduce((a,b)=>a+b)/allDi.length)+' mmHg ('+allS.length+' leituras)');
  if(allG.length)L.push('Glicémia: média '+Math.round(allG.reduce((a,b)=>a+b)/allG.length)+' mg/dL ('+allG.length+' leituras)');
  const allP=allD.map(d=>DB.records?.[d]?.peso).filter(Boolean);
  if(allP.length)L.push('Peso: '+Math.round(allP.reduce((a,b)=>a+b)/allP.length*10)/10+' kg (média)');
  L.push('Adesão: '+Math.round(recN/allD.length*100)+'% ('+recN+'/'+allD.length+' dias)','','── REGISTOS DIÁRIOS ────────────','');
  allD.slice().reverse().forEach(date=>{
    const r=DB.records?.[date];if(!r)return;const ps=[];
    if(r.tensao?.length){const t=r.tensao.slice(-1)[0];ps.push('TA:'+t.sistolica+'/'+t.diastolica+'mmHg');}
    if(r.glicemia?.length)ps.push('Gli:'+r.glicemia.map(g=>g.value+'('+g.context+')').join(',')+' mg/dL');
    if(r.peso)ps.push('Peso:'+r.peso+'kg');if(r.temperatura)ps.push('T:'+r.temperatura+'°C');
    if(r.spo2)ps.push('SpO₂:'+r.spo2+'%');if(r.fc)ps.push('FC:'+r.fc+'bpm');
    if(r.agua)ps.push('Água:'+r.agua+'x');if(r.sono)ps.push('Sono:'+r.sono+'h');
    if(r.evacuacao)ps.push('Int:'+r.evacuacao);if(r.quedas>0)ps.push('⚠️Queda×'+r.quedas);
    const _a=getMedAdh(r);if(_a&&_a.done>0)ps.push('Med:'+_a.done+'/'+_a.total);
    if(!ps.length)return;L.push(fmtS(date)+' ('+WDF[new Date(date+'T12:00').getDay()].slice(0,3)+'): '+ps.join(' | '));
    const rf=Object.entries(r.refeicoes||{}).filter(([,v])=>v).map(([,v])=>v.slice(0,30)).join(' / ');
    if(rf)L.push('   Ref: '+rf);if(r.notas)L.push('   Obs: '+r.notas);
  });
  L.push('','══════════════════════════════','Memória Viva · DAR+ · www.darmais.pt','══════════════════════════════');
  const txt=L.join('\n');
  const z=document.getElementById('txt-zone');if(!z)return;z._txt=txt;
  z.innerHTML=`<div style="font-size:12px;color:var(--txl);margin-bottom:5px">Copie para enviar ao médico:</div>
  <textarea readonly rows="9" style="font-family:monospace;font-size:10px;background:var(--bg2);border-color:var(--bord);margin-bottom:8px">${esc(txt)}</textarea>
  <button id="cpbtn" class="btn-pri" onclick="doCopy()">📋 Copiar Relatório</button>`;
}
window.doCopy=function(){
  const z=document.getElementById('txt-zone');const txt=z?._txt;if(!txt)return;
  const btn=document.getElementById('cpbtn');
  function ok(){if(btn){btn.textContent='✅ Copiado!';btn.style.background='var(--sage)';setTimeout(()=>{btn.textContent='📋 Copiar Relatório';btn.style.background='';},3000);}}
  try{navigator.clipboard.writeText(txt).then(ok).catch(()=>{z.querySelector('textarea')?.select();document.execCommand('copy');ok();});}
  catch{z.querySelector('textarea')?.select();document.execCommand('copy');ok();}
}

          ${m.refeicao&&m.refeicao!=='sem indicação'?`<div style="font-size:12px;color:var(--txl);margin-top:2px">🍽️ ${esc(m.refeicao)}</div>`:''}

  </div></div>`;
}

function renderCarer(el){

// Pares de cartas — encontra os pares iguais (naipe)
var _cpFlipped=[], _cpMatched=[], _cpCards=[], _cpErrors=0, _cpChecking=false;
reg('cog_cartas_pares', function(el){ startCartasPares(el); });
function startCartasPares(el){
  var lv = COG_LEVELS[_cogLevel||'suave'];
  var pairs = lv.id==='suave'?3:lv.id==='ativo'?5:7;
  // Build deck with pairs of suits+values
  var deck = [];
  var pool = [];
  CARD_SUITS.forEach(function(s){ CARD_VALUES.forEach(function(v){ pool.push(makeCard(s,v)); }); });
  pool = pool.sort(function(){return Math.random()-.5}).slice(0,pairs);
  deck = pool.concat(pool.map(function(c){return {suit:c.suit,val:c.val,id:c.id};}));
  deck = deck.sort(function(){return Math.random()-.5}).map(function(c,i){return Object.assign({},c,{uid:i});});
  _cpCards=deck; _cpFlipped=[]; _cpMatched=[]; _cpErrors=0; _cpChecking=false;
  renderCartasPares(el);
}
function renderCartasPares(el){
  var lv = COG_LEVELS[_cogLevel||'suave'];
  var pairs = lv.id==='suave'?3:lv.id==='ativo'?5:7;
  var matched = _cpMatched.length/2;
  if(matched>=pairs && pairs>0){ showCogEnd(el,'🃏 Pares de Cartas',pairs); return; }
  var cols = pairs<=3?3:pairs<=5?4:4;
  var html = '<div class="screen">'+clockHtml(true);
  html += cogHeader('🃏 Pares de Cartas', matched+1, pairs);
  html += '<div style="font-size:13px;color:var(--txm);margin-bottom:12px;font-family:var(--ff2)">Encontre os pares — cartas iguais!</div>';
  html += '<div style="display:grid;grid-template-columns:repeat('+cols+',1fr);gap:8px;justify-items:center">';
  _cpCards.forEach(function(c){
    var isF = _cpFlipped.indexOf(c.uid)>=0;
    var isM = _cpMatched.indexOf(c.uid)>=0;
    html += '<div onclick="flipCarta(this)" data-uid="'+c.uid+'" style="cursor:'+(isM?'default':'pointer')+';opacity:'+(isM?0.5:1)+';">';
    if(isF||isM) html += cardHtml(c,'sm');
    else html += cardBack('sm');
    html += '</div>';
  });
  html += '</div>';
  if(_cpErrors>0) html += '<div style="text-align:center;font-size:12px;color:var(--txl);margin-top:10px">'+encourage()+'</div>';
  html += '</div>';
  el.innerHTML=html;
  if(_cpMatched.length===_cpCards.length && _cpCards.length>0){
    setTimeout(function(){ showCogEnd(document.getElementById('content'),'🃏 Pares de Cartas',pairs); },400);
  }
}
window.flipCarta=function(el){
  var uid=parseInt(el.dataset.uid);
  if(_cpChecking||_cpFlipped.indexOf(uid)>=0||_cpMatched.indexOf(uid)>=0) return;
  var nx=_cpFlipped.concat([uid]); _cpFlipped=nx;
  renderCartasPares(document.getElementById('content'));
  if(nx.length===2){
    _cpChecking=true;
    var a=_cpCards.find(function(c){return c.uid===nx[0]});
    var b=_cpCards.find(function(c){return c.uid===nx[1]});
    if(a.id===b.id){
      var nm=_cpMatched.concat(nx);
      setTimeout(function(){ _cpMatched=nm; _cpFlipped=[]; _cpChecking=false;
        cogCorrect(COG_LEVELS[_cogLevel||'suave'].stars, function(){ renderCartasPares(document.getElementById('content')); });
      },400);
    } else {
      _cpErrors++;
      setTimeout(function(){ _cpFlipped=[]; _cpChecking=false; renderCartasPares(document.getElementById('content')); },900);
    }
  }
};

var SUDOKU_4x4_PUZZLES = [
  {grid:[[1,0,3,0],[0,3,0,1],[3,0,1,0],[0,1,0,3]], sol:[[1,2,3,4],[4,3,2,1],[3,4,1,2],[2,1,4,3]]},
  {grid:[[0,2,0,4],[3,0,1,0],[0,4,0,2],[1,0,3,0]], sol:[[1,2,3,4],[3,4,1,2],[4,1,2,3],[2,3,4,1]]},  // Note: simplified, may not be perfectly valid sudoku but playable

var SUDOKU_6x6_PUZZLES = [
  {grid:[[1,0,0,4,0,6],[0,4,6,0,1,0],[0,1,0,0,6,4],[4,6,0,1,0,0],[0,0,4,6,0,1],[6,0,1,0,4,0]],
   sol:[[1,2,3,4,5,6],[3,4,6,5,1,2],[2,1,5,3,6,4],[4,6,2,1,3,5],[5,3,4,6,2,1],[6,5,1,2,4,3]]},
];
var _sudGrid=[], _sudSol=[], _sudSel=null, _sudSize=4;
reg('cog_sudoku', function(el){ startSudoku(el); });
function startSudoku(el){
  var lv=COG_LEVELS[_cogLevel||'ativo'];
  _sudSize = lv.id==='desafio'?6:4;
  var puzzles = _sudSize===4?SUDOKU_4x4_PUZZLES:SUDOKU_6x6_PUZZLES;
  var p = puzzles[Math.floor(Math.random()*puzzles.length)];
  _sudGrid = p.grid.map(function(r){return r.slice();});
  _sudSol = p.sol;
  _sudSel = null;
  renderSudoku(el);
}
function renderSudoku(el){
  var html='<div class="screen">'+clockHtml(true);
  html+=cogHeader('\uD83D\uDD22 Sudoku '+_sudSize+'\xD7'+_sudSize,1,1);
  html+='<div style="font-size:12px;color:var(--txm);margin-bottom:10px;font-family:var(--ff2)">'+

  html+='<div style="display:grid;grid-template-columns:repeat('+_sudSize+','+cellSize+'px);gap:'+gap+'px;justify-content:center;margin-bottom:14px">';
  for(var r=0;r<_sudSize;r++){
    for(var c=0;c<_sudSize;c++){
      var orig = SUDOKU_4x4_PUZZLES.concat(SUDOKU_6x6_PUZZLES).find(function(p2){return true;});
      var isFixed = (_sudSize===4?SUDOKU_4x4_PUZZLES[0]:SUDOKU_6x6_PUZZLES[0]).grid[r][c]!==0;
      // Recheck: is this cell originally filled?
      var curPuzzle = _sudSize===4?SUDOKU_4x4_PUZZLES:SUDOKU_6x6_PUZZLES;
      var origVal=0;
      curPuzzle.forEach(function(p2){
        if(JSON.stringify(p2.sol)===JSON.stringify(_sudSol)) origVal=p2.grid[r][c];
      });
      isFixed=(origVal!==0);
      var val=_sudGrid[r][c];
      var isSel=_sudSel&&_sudSel[0]===r&&_sudSel[1]===c;
      var isErr=val!==0&&val!==_sudSol[r][c];
      var bg=isFixed?'var(--bg2)':isSel?'rgba(74,123,181,.2)':isErr?'rgba(192,57,43,.1)':'var(--card)';
      var border=isSel?'2px solid var(--pri)':isErr?'2px solid var(--danger)':'1px solid var(--bord)';

      var extraStyle='';
      if(_sudSize===4&&(r===1||r===3)) extraStyle+='border-bottom:2px solid var(--pri);';
      if(_sudSize===4&&(c===1||c===3)) extraStyle+='border-right:2px solid var(--pri);';
      html+='<div onclick="sudSelect(this)" data-r="'+r+'" data-c="'+c+'" data-fixed="'+(isFixed?1:0)+'" ';

        'display:flex;align-items:center;justify-content:center;cursor:'+(isFixed?'default':'pointer')+';'+extraStyle+'">';
      html+='<span style="font-size:'+(cellSize>60?24:18)+'px;font-weight:700;color:'+(isFixed?'var(--txm)':isErr?'var(--danger)':'var(--pri)')+'">'+
        (val!==0?val:'')+'</span></div>';
    }
  }
  html+='</div>';
  // Number pad
  html+='<div style="display:flex;gap:8px;justify-content:center;margin-bottom:10px">';
  for(var n=1;n<=_sudSize;n++){

  }
  html+='<button onclick="sudEnter(this)" data-n="0" style="width:46px;height:46px;background:var(--dangerl);color:var(--danger);border:none;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer;">✕</button>';
  html+='</div>';
  // Check if complete
  var complete=true;
  for(var r2=0;r2<_sudSize&&complete;r2++) for(var c2=0;c2<_sudSize&&complete;c2++) if(_sudGrid[r2][c2]!==_sudSol[r2][c2]) complete=false;
  if(complete){
    html+='<div style="text-align:center;padding:12px;background:rgba(58,158,114,.1);border-radius:14px;border:2px solid var(--sage)">'+
      '<div style="font-size:24px;margin-bottom:4px">🏆</div>'+
      '<div style="font-size:16px;font-weight:700;color:var(--sage)">Sudoku completo! Excelente!</div></div>';
    setTimeout(function(){
      _cogSession.correct++; _cogSession.score+=COG_LEVELS[_cogLevel||'ativo'].stars*2;
      cogCorrect(COG_LEVELS[_cogLevel||'ativo'].stars*2, function(){ go('cognitivo_hub'); });
    },500);
  }
  html+='</div>';
  el.innerHTML=html;
}
window.sudSelect=function(el){
  if(parseInt(el.dataset.fixed)) return;
  _sudSel=[parseInt(el.dataset.r),parseInt(el.dataset.c)];
  renderSudoku(document.getElementById('content'));

  var n=parseInt(el.dataset.n);

  renderSudoku(document.getElementById('content'));
};

  if(CACAPAL_PUZZLES.length<=1){_cpPuzzleIdx=0;return;}

reg('cog_cacapal',function(el){ cpPickPuzzle(); _cpPuzzle=CACAPAL_PUZZLES[_cpPuzzleIdx]; _cpFound=[]; _cpSel=[]; renderCacaPal(el); });
function renderCacaPal(el){
  var p=_cpPuzzle;
  if(_cpFound.length>=p.words.length){ _cogSession.total+=p.words.length; showCogEnd(el,'\uD83D\uDD0D Caça-palavras',p.words.length); return; }
  var html='<div class="screen">'+clockHtml(true);
  html+=cogHeader('\uD83D\uDD0D Caça-palavras',_cpFound.length+1,p.words.length);
  html+='<div style="font-size:12px;color:var(--txm);margin-bottom:8px;text-align:center">Toque nas letras seguidas para formar cada palavra e depois em Verificar.</div>';
  html+='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;justify-content:center">';
  p.words.forEach(function(w){
    var found=_cpFound.indexOf(w)>=0;
    html+='<span style="padding:4px 10px;border-radius:8px;font-size:13px;font-weight:700;'+
      'background:'+(found?'var(--sage)':'var(--bg2)')+';color:'+(found?'#fff':'var(--txm)')+';'+
      'text-decoration:'+(found?'line-through':'none')+'">'+w+'</span>';
  });
  html+='</div>';
  html+='<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-bottom:12px">';
  p.grid.forEach(function(row,r){
    row.forEach(function(letter,c){
      var isSel=_cpSel.some(function(s){return s.r===r&&s.c===c;});
      var isFound=false;
      _cpFound.forEach(function(w){
        if(p.positions[w]&&p.positions[w].some(function(pos){return pos.r===r&&pos.c===c;})) isFound=true;
      });
      html+='<div onclick="cpTap(this)" data-r="'+r+'" data-c="'+c+'" ';
      html+='style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;font-size:18px;font-weight:700;'+
        'background:'+(isFound?'rgba(58,158,114,.25)':isSel?'rgba(232,90,46,.18)':'var(--card)')+';'+
        'border:1.5px solid '+(isFound?'var(--sage)':isSel?'var(--pri)':'var(--bord)')+';'+
        'color:'+(isFound?'var(--sage)':isSel?'var(--pri)':'var(--tx)')+'">'+letter+'</div>';
    });
  });
  html+='</div>';
  if(_cpSel.length>0){
    var selWord=_cpSel.map(function(s){return p.grid[s.r][s.c];}).join('');
    html+='<div style="text-align:center;margin-bottom:8px;font-size:20px;font-weight:700;color:var(--pri);letter-spacing:4px">'+selWord+'</div>';
    html+='<div style="display:flex;gap:8px"><button onclick="cpClear()" style="flex:1;background:var(--dangerl);border:none;border-radius:12px;padding:12px;font-size:14px;color:var(--danger);cursor:pointer;font-weight:600">\u2715 Limpar</button>';
    html+='<button onclick="cpCheck()" style="flex:2;background:var(--pri);border:none;border-radius:12px;padding:12px;font-size:14px;color:#fff;cursor:pointer;font-weight:600">\u2713 Verificar</button></div>';
  }
  html+='</div>';
  el.innerHTML=html;
}
window.cpTap=function(elm){
  var r=parseInt(elm.dataset.r),c=parseInt(elm.dataset.c);
  var already=_cpSel.findIndex(function(s){return s.r===r&&s.c===c;});
  if(already>=0){ _cpSel.splice(already,1); } else { _cpSel.push({r:r,c:c}); }
  renderCacaPal(document.getElementById('content'));
};
window.cpClear=function(){ _cpSel=[]; renderCacaPal(document.getElementById('content')); };
window.cpCheck=function(){
  var p=_cpPuzzle;
  var selWord=_cpSel.map(function(s){return p.grid[s.r][s.c];}).join('');
  var selWordRev=_cpSel.slice().reverse().map(function(s){return p.grid[s.r][s.c];}).join('');
  // aceita a palavra em qualquer ordem de seleção (frente ou trás), desde que as células coincidam com as posições
  var found=p.words.find(function(w){
    if(_cpFound.indexOf(w)>=0) return false;
    if(w!==selWord && w!==selWordRev) return false;
    var pos=p.positions[w];
    if(!pos||pos.length!==_cpSel.length) return false;
    var fwd=pos.every(function(pp,i){return _cpSel[i]&&_cpSel[i].r===pp.r&&_cpSel[i].c===pp.c;});
    var bwd=pos.every(function(pp,i){var j=_cpSel.length-1-i;return _cpSel[j]&&_cpSel[j].r===pp.r&&_cpSel[j].c===pp.c;});
    return fwd||bwd;
  });
  if(found){
    _cpFound.push(found); _cpSel=[];
    cogCorrect(COG_LEVELS[_cogLevel||'desafio'].stars, function(){ renderCacaPal(document.getElementById('content')); });
  } else {
    _cpSel=[];
    cogWrong(null, function(){ renderCacaPal(document.getElementById('content')); });
  }
};

var CARD_SUITS = ['♦','♥','♠','♣'];
var CARD_SUIT_NAMES = {'\u2666':'Ouros','\u2665':'Copas','\u2660':'Espadas','\u2663':'Paus'};
var CARD_SUIT_COLORS = {'\u2666':'#c0392b','\u2665':'#c0392b','\u2660':'#2c4a7c','\u2663':'#2c4a7c'};
var CARD_VALUES = ['A','2','3','4','5','6','7','J','Q','K'];

function makeCard(suit, val){
  return {suit:suit, val:val, id:suit+val};
}
function cardHtml(card, size){
  size = size||'normal';
  var col = CARD_SUIT_COLORS[card.suit];
  var fs = size==='big'?'28px':size==='sm'?'16px':'22px';
  var w = size==='big'?'80px':size==='sm'?'48px':'62px';
  var h = size==='big'?'110px':size==='sm'?'68px':'88px';
  return '<div style="width:'+w+';height:'+h+';background:#fff;border-radius:10px;border:2px solid #d0d8e8;'+
    'display:inline-flex;flex-direction:column;align-items:center;justify-content:center;'+
    'box-shadow:0 2px 6px rgba(0,0,0,.12);flex-shrink:0;user-select:none">'+
    '<div style="font-size:'+fs+';color:'+col+';font-weight:700;line-height:1">'+card.val+'</div>'+
    '<div style="font-size:'+fs+';color:'+col+';line-height:1">'+card.suit+'</div>'+
  '</div>';
}
function cardBack(size){
  var w = size==='big'?'80px':size==='sm'?'48px':'62px';
  var h = size==='big'?'110px':size==='sm'?'68px':'88px';
  return '<div style="width:'+w+';height:'+h+';background:var(--navy,#2c4a7c);border-radius:10px;border:2px solid var(--bord);'+
    'display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.12);flex-shrink:0">'+
    '<div style="font-size:20px">🎴</div>'+
  '</div>';
}

// Pares de cartas — encontra os pares iguais (naipe)
var _cpFlipped=[], _cpMatched=[], _cpCards=[], _cpErrors=0, _cpChecking=false;
reg('cog_cartas_pares', function(el){ startCartasPares(el); });
function startCartasPares(el){
  var lv = COG_LEVELS[_cogLevel||'suave'];
  var pairs = lv.id==='suave'?3:lv.id==='ativo'?5:7;
  // Build deck with pairs of suits+values
  var deck = [];
  var pool = [];
  CARD_SUITS.forEach(function(s){ CARD_VALUES.forEach(function(v){ pool.push(makeCard(s,v)); }); });
  pool = pool.sort(function(){return Math.random()-.5}).slice(0,pairs);
  deck = pool.concat(pool.map(function(c){return {suit:c.suit,val:c.val,id:c.id};}));
  deck = deck.sort(function(){return Math.random()-.5}).map(function(c,i){return Object.assign({},c,{uid:i});});
  _cpCards=deck; _cpFlipped=[]; _cpMatched=[]; _cpErrors=0; _cpChecking=false;
  renderCartasPares(el);
}
function renderCartasPares(el){
  var lv = COG_LEVELS[_cogLevel||'suave'];
  var pairs = lv.id==='suave'?3:lv.id==='ativo'?5:7;
  var matched = _cpMatched.length/2;
  if(matched>=pairs && pairs>0){ showCogEnd(el,'🃏 Pares de Cartas',pairs); return; }
  var cols = pairs<=3?3:pairs<=5?4:4;
  var html = '<div class="screen">'+clockHtml(true);
  html += cogHeader('🃏 Pares de Cartas', matched+1, pairs);
  html += '<div style="font-size:13px;color:var(--txm);margin-bottom:12px;font-family:var(--ff2)">Encontre os pares — cartas iguais!</div>';
  html += '<div style="display:grid;grid-template-columns:repeat('+cols+',1fr);gap:8px;justify-items:center">';
  _cpCards.forEach(function(c){
    var isF = _cpFlipped.indexOf(c.uid)>=0;
    var isM = _cpMatched.indexOf(c.uid)>=0;
    html += '<div onclick="flipCarta(this)" data-uid="'+c.uid+'" style="cursor:'+(isM?'default':'pointer')+';opacity:'+(isM?0.5:1)+';">';
    if(isF||isM) html += cardHtml(c,'sm');
    else html += cardBack('sm');
    html += '</div>';
  });
  html += '</div>';
  if(_cpErrors>0) html += '<div style="text-align:center;font-size:12px;color:var(--txl);margin-top:10px">'+encourage()+'</div>';
  html += '</div>';
  el.innerHTML=html;
  if(_cpMatched.length===_cpCards.length && _cpCards.length>0){
    setTimeout(function(){ showCogEnd(document.getElementById('content'),'🃏 Pares de Cartas',pairs); },400);
  }
}
window.flipCarta=function(el){
  var uid=parseInt(el.dataset.uid);
  if(_cpChecking||_cpFlipped.indexOf(uid)>=0||_cpMatched.indexOf(uid)>=0) return;
  var nx=_cpFlipped.concat([uid]); _cpFlipped=nx;
  renderCartasPares(document.getElementById('content'));
  if(nx.length===2){
    _cpChecking=true;
    var a=_cpCards.find(function(c){return c.uid===nx[0]});
    var b=_cpCards.find(function(c){return c.uid===nx[1]});
    if(a.id===b.id){
      var nm=_cpMatched.concat(nx);
      setTimeout(function(){ _cpMatched=nm; _cpFlipped=[]; _cpChecking=false;
        cogCorrect(COG_LEVELS[_cogLevel||'suave'].stars, function(){ renderCartasPares(document.getElementById('content')); });
      },400);
    } else {
      _cpErrors++;
      setTimeout(function(){ _cpFlipped=[]; _cpChecking=false; renderCartasPares(document.getElementById('content')); },900);
    }
  }
};

// ── JOGO: BISCA ──────────────────────────────────────────────────
// Regras da Bisca: trunfo bate não-trunfo; dentro do mesmo naipe, ordem: A>7>K>J>Q>6>5>4>3>2
var BISCA_ORDER = {'A':11,'7':10,'K':4,'J':3,'Q':2,'6':0,'5':0,'4':0,'3':0,'2':0};
var BISCA_Q_POOL = [
  // [carta1, carta2, trunfo, resposta_idx, explicacao]
  {c1:{s:'\u2665',v:'A'}, c2:{s:'\u2665',v:'K'}, trump:'\u2660', ans:0, exp:'O Ás vale mais que o Rei no mesmo naipe'},
  {c1:{s:'\u2666',v:'7'}, c2:{s:'\u2666',v:'A'}, trump:'\u2665', ans:1, exp:'O Ás (11 pts) supera o 7 (10 pts) no mesmo naipe'},
  {c1:{s:'\u2665',v:'3'}, c2:{s:'\u2660',v:'2'}, trump:'\u2665', ans:0, exp:'O 3 de Copas é trunfo — bate qualquer outra carta'},
  {c1:{s:'\u2660',v:'A'}, c2:{s:'\u2665',v:'K'}, trump:'\u2666', ans:0, exp:'O Ás vence o Rei sem trunfo envolvido'},
  {c1:{s:'\u2663',v:'5'}, c2:{s:'\u2666',v:'5'}, trump:'\u2666', ans:1, exp:'O 5 de Ouros é trunfo — bate o 5 de Paus'},
  {c1:{s:'\u2665',v:'7'}, c2:{s:'\u2665',v:'K'}, trump:'\u2660', ans:0, exp:'O 7 (10 pts) vale mais que o Rei (4 pts)'},
  {c1:{s:'\u2666',v:'J'}, c2:{s:'\u2666',v:'Q'}, trump:'\u2665', ans:0, exp:'O Valete (3 pts) supera a Dama (2 pts)'},
  {c1:{s:'\u2660',v:'A'}, c2:{s:'\u2663',v:'7'}, trump:'\u2663', ans:1, exp:'O 7 de Paus é trunfo — bate o Ás de Espadas'},
];
var _biscaIdx=0, _biscaShuf=[];
reg('cog_bisca', function(el){ _biscaShuf=BISCA_Q_POOL.slice().sort(function(){return Math.random()-.5}); _biscaIdx=0; renderBisca(el); });
function renderBisca(el){
  if(_biscaIdx>=5){ showCogEnd(el,'♠ Bisca',5); return; }
  var q=_biscaShuf[_biscaIdx];
  var html='<div class="screen">'+clockHtml(true);
  html+=cogHeader('\u2660 Bisca: Qual Carta Ganha?',_biscaIdx+1,5);
  html+='<div class="card" style="text-align:center;padding:14px">';
  html+='<div style="font-size:13px;color:var(--txl);margin-bottom:8px">Trunfo da jogada:</div>';
  html+='<div style="font-size:28px;margin-bottom:12px">'+q.trump+' <span style="font-size:16px;color:var(--txm)">'+(CARD_SUIT_NAMES[q.trump]||'')+'</span></div>';
  html+='<div style="font-size:13px;color:var(--txm);margin-bottom:12px">Qual destas cartas ganha?</div>';
  html+='<div style="display:flex;justify-content:center;gap:24px">';
  html+='<div onclick="answerBisca(this)" data-idx="0" data-ans="'+q.ans+'" data-exp="'+esc(q.exp)+'" style="cursor:pointer">';
  html+=cardHtml(q.c1,'big');
  html+='<div style="text-align:center;margin-top:6px;font-size:13px;color:var(--pri);font-weight:700">Carta 1</div></div>';
  html+='<div onclick="answerBisca(this)" data-idx="1" data-ans="'+q.ans+'" data-exp="'+esc(q.exp)+'" style="cursor:pointer">';
  html+=cardHtml(q.c2,'big');
  html+='<div style="text-align:center;margin-top:6px;font-size:13px;color:var(--pri);font-weight:700">Carta 2</div></div>';
  html+='</div></div>';
  html+='<div class="card" style="background:var(--bg2);padding:10px 14px">';
  html+='<div style="font-size:11px;color:var(--txl);line-height:1.7">💡 Na Bisca: Ás=11pts, 7=10pts, Rei=4pts, Valete=3pts, Dama=2pts. O trunfo bate tudo!</div>';
  html+='</div></div>';
  el.innerHTML=html;
}
window.answerBisca=function(el){
  var chosen=parseInt(el.dataset.idx), correct=parseInt(el.dataset.ans), exp=el.dataset.exp;
  var ok=chosen===correct;
  var cards=el.parentElement.querySelectorAll('[data-idx]');
  cards.forEach(function(c){ c.style.cursor='default'; c.style.opacity=parseInt(c.dataset.idx)===correct?1:.4; });
  _biscaIdx++;
  if(ok) cogCorrect(COG_LEVELS[_cogLevel||'ativo'].stars, function(){ renderBisca(document.getElementById('content')); });
  else cogWrong(exp, function(){ renderBisca(document.getElementById('content')); });
};

// ── JOGO: DOMINÓ ────────────────────────────────────────────────
// Mostra uma cadeia de peças de dominó, pergunta qual encaixa na ponta aberta
var DOMINO_Q_POOL = [
  {chain:[[1,2],[2,4],[4,3]], open:3, opts:[{a:3,b:5},{a:1,b:3},{a:3,b:0},{a:2,b:6}], ans:1},
  {chain:[[0,0],[0,3],[3,5]], open:5, opts:[{a:5,b:2},{a:1,b:4},{a:0,b:2},{a:5,b:5}], ans:0},
  {chain:[[2,6],[6,1],[1,4]], open:4, opts:[{a:0,b:3},{a:4,b:6},{a:3,b:2},{a:4,b:1}], ans:1},
  {chain:[[3,3],[3,6],[6,2]], open:2, opts:[{a:2,b:5},{a:0,b:4},{a:3,b:1},{a:2,b:2}], ans:0},
  {chain:[[5,4],[4,4],[4,0]], open:0, opts:[{a:1,b:2},{a:0,b:6},{a:3,b:5},{a:0,b:0}], ans:3},
  {chain:[[1,1],[1,5],[5,3]], open:3, opts:[{a:3,b:4},{a:1,b:2},{a:3,b:6},{a:0,b:5}], ans:2},
  {chain:[[6,6],[6,3],[3,1]], open:1, opts:[{a:1,b:1},{a:0,b:6},{a:4,b:3},{a:1,b:5}], ans:0},
];
function dominoPieceHtml(a,b,highlight){
  var hl=highlight?'border:3px solid var(--sage);background:rgba(58,158,114,.1);':'border:2px solid var(--bord);background:#fff;';
  return '<div style="display:inline-flex;flex-direction:column;border-radius:8px;'+hl+'padding:4px 3px;min-width:36px;text-align:center;box-shadow:0 1px 4px var(--sh)">'+
    '<div style="font-size:18px;line-height:1;padding:2px 0">'+domiDots(a)+'</div>'+
    '<div style="height:1px;background:var(--bord);margin:2px 0"></div>'+
    '<div style="font-size:18px;line-height:1;padding:2px 0">'+domiDots(b)+'</div>'+
  '</div>';
}
var DOMI_DOT = ['⬜','1️⃣','2️⃣','3️⃣','4️⃣','5️⃣','6️⃣'];
function domiDots(n){ return DOMI_DOT[n]||'⬜'; }

var _domiIdx=0, _domiShuf=[];
reg('cog_domino', function(el){ _domiShuf=DOMINO_Q_POOL.slice().sort(function(){return Math.random()-.5}); _domiIdx=0; renderDomino(el); });
function renderDomino(el){
  if(_domiIdx>=5){ showCogEnd(el,'\uD83C\uDC41 Dominó',5); return; }
  var q=_domiShuf[_domiIdx];
  var lv=COG_LEVELS[_cogLevel||'ativo'];
  var numOpts=lv.id==='suave'?2:lv.id==='ativo'?3:4;
  // Build options: correct answer + wrong ones
  var optsToShow=[q.opts[q.ans]];
  q.opts.filter(function(_,i){return i!==q.ans;}).slice(0,numOpts-1).forEach(function(o){optsToShow.push(o);});
  optsToShow=optsToShow.sort(function(){return Math.random()-.5;});
  var correctOpt=optsToShow.findIndex(function(o){return o.a===q.opts[q.ans].a&&o.b===q.opts[q.ans].b;});

  var html='<div class="screen">'+clockHtml(true);
  html+=cogHeader('🁣 Dominó: Qual Encaixa?',_domiIdx+1,5);
  html+='<div class="card" style="padding:16px">';
  html+='<div style="font-size:13px;color:var(--txl);margin-bottom:12px;text-align:center">Cadeia de dominó:</div>';
  html+='<div style="display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;margin-bottom:12px">';
  q.chain.forEach(function(p,i){
    html+=dominoPieceHtml(p[0],p[1],false);
    if(i<q.chain.length-1) html+='<span style="font-size:16px;color:var(--txl)">—</span>';
  });
  html+='<span style="font-size:16px;color:var(--txl)">—</span>';
  html+='<div style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:60px;border-radius:8px;border:2px dashed var(--pri);color:var(--pri);font-size:20px">?</div>';
  html+='</div>';
  html+='<div style="font-size:13px;color:var(--txm);text-align:center">A ponta aberta tem o número <strong style="color:var(--pri);font-size:18px">'+q.open+'</strong> — qual peça encaixa?</div>';
  html+='</div>';
  html+='<div style="display:grid;grid-template-columns:repeat('+numOpts+',1fr);gap:10px;margin-top:10px">';
  optsToShow.forEach(function(o,i){
    html+='<div onclick="answerDomino(this)" data-i="'+i+'" data-correct="'+correctOpt+'" ';
    html+='style="background:var(--card);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;border:2px solid var(--bord);box-shadow:0 2px 8px var(--sh)">';
    html+=dominoPieceHtml(o.a,o.b,false);
    html+='</div>';
  });
  html+='</div></div>';
  el.innerHTML=html;
}
window.answerDomino=function(el){
  var i=parseInt(el.dataset.i), correct=parseInt(el.dataset.correct), ok=i===correct;
  el.parentElement.querySelectorAll('[data-i]').forEach(function(c){
    c.style.cursor='default';
    if(parseInt(c.dataset.i)===correct) c.style.background='rgba(58,158,114,.15)', c.style.borderColor='var(--sage)';
    else if(c===el&&!ok) c.style.background='rgba(192,57,43,.08)', c.style.borderColor='var(--danger)';
  });
  _domiIdx++;
  if(ok) cogCorrect(COG_LEVELS[_cogLevel||'ativo'].stars, function(){ renderDomino(document.getElementById('content')); });
  else cogWrong(null, function(){ renderDomino(document.getElementById('content')); });
};

// ── JOGO: SUDOKU ────────────────────────────────────────────────
// 4x4 para Ativo, 6x6 para Desafio
var SUDOKU_4x4_PUZZLES = [
  {grid:[[1,0,3,0],[0,3,0,1],[3,0,1,0],[0,1,0,3]], sol:[[1,2,3,4],[4,3,2,1],[3,4,1,2],[2,1,4,3]]},
  {grid:[[0,2,0,4],[3,0,1,0],[0,4,0,2],[1,0,3,0]], sol:[[1,2,3,4],[3,4,1,2],[4,1,2,3],[2,3,4,1]]},  // Note: simplified, may not be perfectly valid sudoku but playable
  {grid:[[4,0,2,0],[0,1,0,3],[2,0,4,0],[0,3,0,1]], sol:[[4,3,2,1],[2,1,4,3],[2,4,3,1],[1,3,2,4]]},
];
var SUDOKU_6x6_PUZZLES = [
  {grid:[[1,0,0,4,0,6],[0,4,6,0,1,0],[0,1,0,0,6,4],[4,6,0,1,0,0],[0,0,4,6,0,1],[6,0,1,0,4,0]],
   sol:[[1,2,3,4,5,6],[3,4,6,5,1,2],[2,1,5,3,6,4],[4,6,2,1,3,5],[5,3,4,6,2,1],[6,5,1,2,4,3]]},
];
var _sudGrid=[], _sudSol=[], _sudSel=null, _sudSize=4;
reg('cog_sudoku', function(el){ startSudoku(el); });
function startSudoku(el){
  var lv=COG_LEVELS[_cogLevel||'ativo'];
  _sudSize = lv.id==='desafio'?6:4;
  var puzzles = _sudSize===4?SUDOKU_4x4_PUZZLES:SUDOKU_6x6_PUZZLES;
  var p = puzzles[Math.floor(Math.random()*puzzles.length)];
  _sudGrid = p.grid.map(function(r){return r.slice();});
  _sudSol = p.sol;
  _sudSel = null;
  renderSudoku(el);
}
function renderSudoku(el){
  var html='<div class="screen">'+clockHtml(true);
  html+=cogHeader('\uD83D\uDD22 Sudoku '+_sudSize+'\xD7'+_sudSize,1,1);
  html+='<div style="font-size:12px;color:var(--txm);margin-bottom:10px;font-family:var(--ff2)">'+
    'Preencha a grelha: cada número de 1-'+_sudSize+' aparece uma vez em cada linha, coluna'+((_sudSize===6)?' e bloco 2x3':' e bloco 2x2')+'.</div>';
  var cellSize = _sudSize===4?72:52;
  var gap = _sudSize===4?3:2;
  html+='<div style="display:grid;grid-template-columns:repeat('+_sudSize+','+cellSize+'px);gap:'+gap+'px;justify-content:center;margin-bottom:14px">';
  for(var r=0;r<_sudSize;r++){
    for(var c=0;c<_sudSize;c++){
      var orig = SUDOKU_4x4_PUZZLES.concat(SUDOKU_6x6_PUZZLES).find(function(p2){return true;});
      var isFixed = (_sudSize===4?SUDOKU_4x4_PUZZLES[0]:SUDOKU_6x6_PUZZLES[0]).grid[r][c]!==0;
      // Recheck: is this cell originally filled?
      var curPuzzle = _sudSize===4?SUDOKU_4x4_PUZZLES:SUDOKU_6x6_PUZZLES;
      var origVal=0;
      curPuzzle.forEach(function(p2){
        if(JSON.stringify(p2.sol)===JSON.stringify(_sudSol)) origVal=p2.grid[r][c];
      });
      isFixed=(origVal!==0);
      var val=_sudGrid[r][c];
      var isSel=_sudSel&&_sudSel[0]===r&&_sudSel[1]===c;
      var isErr=val!==0&&val!==_sudSol[r][c];
      var bg=isFixed?'var(--bg2)':isSel?'rgba(74,123,181,.2)':isErr?'rgba(192,57,43,.1)':'var(--card)';
      var border=isSel?'2px solid var(--pri)':isErr?'2px solid var(--danger)':'1px solid var(--bord)';
      // Box borders for 2x2 or 2x3
      var extraStyle='';
      if(_sudSize===4&&(r===1||r===3)) extraStyle+='border-bottom:2px solid var(--pri);';
      if(_sudSize===4&&(c===1||c===3)) extraStyle+='border-right:2px solid var(--pri);';
      html+='<div onclick="sudSelect(this)" data-r="'+r+'" data-c="'+c+'" data-fixed="'+(isFixed?1:0)+'" ';
      html+='style="width:'+cellSize+'px;height:'+cellSize+'px;background:'+bg+';border:'+border+';border-radius:6px;'+
        'display:flex;align-items:center;justify-content:center;cursor:'+(isFixed?'default':'pointer')+';'+extraStyle+'">';
      html+='<span style="font-size:'+(cellSize>60?24:18)+'px;font-weight:700;color:'+(isFixed?'var(--txm)':isErr?'var(--danger)':'var(--pri)')+'">'+
        (val!==0?val:'')+'</span></div>';
    }
  }
  html+='</div>';
  // Number pad
  html+='<div style="display:flex;gap:8px;justify-content:center;margin-bottom:10px">';
  for(var n=1;n<=_sudSize;n++){
    html+='<button onclick="sudEnter(this)" data-n="'+n+'" style="width:46px;height:46px;background:var(--pri);color:#fff;border:none;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer;">'+n+'</button>';
  }
  html+='<button onclick="sudEnter(this)" data-n="0" style="width:46px;height:46px;background:var(--dangerl);color:var(--danger);border:none;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer;">✕</button>';
  html+='</div>';
  // Check if complete
  var complete=true;
  for(var r2=0;r2<_sudSize&&complete;r2++) for(var c2=0;c2<_sudSize&&complete;c2++) if(_sudGrid[r2][c2]!==_sudSol[r2][c2]) complete=false;
  if(complete){
    html+='<div style="text-align:center;padding:12px;background:rgba(58,158,114,.1);border-radius:14px;border:2px solid var(--sage)">'+
      '<div style="font-size:24px;margin-bottom:4px">🏆</div>'+
      '<div style="font-size:16px;font-weight:700;color:var(--sage)">Sudoku completo! Excelente!</div></div>';
    setTimeout(function(){
      _cogSession.correct++; _cogSession.score+=COG_LEVELS[_cogLevel||'ativo'].stars*2;
      cogCorrect(COG_LEVELS[_cogLevel||'ativo'].stars*2, function(){ go('cognitivo_hub'); });
    },500);
  }
  html+='</div>';
  el.innerHTML=html;
}
window.sudSelect=function(el){
  if(parseInt(el.dataset.fixed)) return;
  _sudSel=[parseInt(el.dataset.r),parseInt(el.dataset.c)];
  renderSudoku(document.getElementById('content'));
};
window.sudEnter=function(el){
  if(!_sudSel) return;
  var n=parseInt(el.dataset.n);
  _sudGrid[_sudSel[0]][_sudSel[1]]=n;

window.revealField=function(id, val){
  var el=document.getElementById('mv-'+id);
  var btn=document.getElementById('mvb-'+id);
  if(!el)return;
  el.textContent=val;
  el.style.letterSpacing='normal';
  if(btn){
    btn.textContent='Ocultar';
    btn.onclick=function(){
      el.style.letterSpacing='2px';
      if(id==='name'){
        var initials=(val||'').split(' ').map(function(w){return w[0]}).join('. ')+'.';
        el.textContent=initials;
      } else {
        el.textContent='••••••••';
      }
      btn.textContent='Ver';
      btn.onclick=function(){revealField(id,val);};
    };
  }
  // Auto-hide after 30 seconds
  setTimeout(function(){
    var b=document.getElementById('mvb-'+id);
    if(b&&b.textContent==='Ocultar')b.click();
  },30000);
};
