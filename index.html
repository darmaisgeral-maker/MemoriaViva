reg('registo_rapido', function(el){ renderRegRapido(el); });
function renderRegRapido(el){
  var date=todayKey();
  var rec=getDay(date);
  var meds=getActiveMeds();
  var ma=getMedAdh(rec);
  var pct=ma&&ma.total?Math.round(ma.done/ma.total*100):0;
  var lT=rec.tensao&&rec.tensao.length?rec.tensao[rec.tensao.length-1]:null;
  var allMedsDone=ma&&ma.total>0&&ma.done===ma.total;

  // Progress indicator
  var steps=0,done=0;
  if(isParamActive('tensao')){steps++;if(lT)done++;}
  if(meds.length){steps++;if(allMedsDone)done++;}
  steps++;if(rec.notas)done++; // notas
  var pctVisita=steps?Math.round(done/steps*100):0;

  var html='<div class="screen">'+
    // Header compacto
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'+
      '<div>'+
        '<div style="font-size:17px;font-weight:700;color:var(--prid);font-family:\'Fraunces\',Georgia,serif">&#9889; Registo da Visita</div>'+
        '<div style="font-size:12px;color:var(--txm)">'+new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})+' &middot; '+new Date().toLocaleDateString('pt-PT',{weekday:'short',day:'numeric',month:'short'})+'</div>'+
      '</div>'+
      '<div style="text-align:center">'+
        '<div style="font-size:18px;font-weight:700;color:'+(pctVisita===100?'var(--sage)':'var(--pri)')+'">'+pctVisita+'%</div>'+
        '<div style="font-size:10px;color:var(--txl)">completo</div>'+
      '</div>'+
    '</div>'+
    '<div style="background:var(--bord);border-radius:20px;height:6px;overflow:hidden;margin-bottom:14px">'+
      '<div style="height:100%;border-radius:20px;background:'+(pctVisita===100?'var(--sage)':'var(--pri)')+';width:'+pctVisita+'%;transition:width .4s"></div></div>';

  // ── TENSÃO ──
  if(isParamActive('tensao')){
    var tColor=lT?(lT.sistolica>160?'var(--danger)':lT.sistolica>140?'var(--gold)':'var(--sage)'):'var(--txl)';
    html+='<div class="card" style="margin-bottom:10px;border-color:'+(lT?tColor+'44':'var(--bord)')+'">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'+
        '<div style="font-size:13px;font-weight:700;color:var(--prid)">&#128147; Tensão Arterial</div>'+
        (lT?'<span style="font-size:14px;font-weight:700;color:'+tColor+'">'+lT.sistolica+'/'+lT.diastolica+' <span style="font-size:10px;font-weight:400;color:var(--txl)">mmHg</span></span>':
           '<span style="font-size:11px;color:var(--txl)">não registada</span>')+
      '</div>'+
      '<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end">'+
        '<div><label class="lbl">Sistólica</label><input type="number" id="rr-sis" value="'+(lT?lT.sistolica:'')+'" min="60" max="260" placeholder="130" style="text-align:center;font-size:22px;font-weight:700;border:2px solid var(--pri);border-radius:12px;padding:10px"></div>'+
        '<div style="font-size:22px;color:var(--txl);text-align:center;padding-bottom:8px">/</div>'+
        '<div><label class="lbl">Diastólica</label><input type="number" id="rr-dia" value="'+(lT?lT.diastolica:'')+'" min="40" max="150" placeholder="80" style="text-align:center;font-size:22px;font-weight:700;border:2px solid var(--pri);border-radius:12px;padding:10px"></div>'+
      '</div>'+
    '</div>';
  }

  // ── MEDICAÇÃO ──
  if(meds.length){
    html+='<div class="card" style="margin-bottom:10px;border-color:'+(allMedsDone?'var(--sage)44':pct>0?'var(--gold)44':'var(--bord)')+'">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'+
        '<div style="font-size:13px;font-weight:700;color:var(--prid)">&#128138; Medicação</div>'+
        '<span style="font-size:14px;font-weight:700;color:'+(allMedsDone?'var(--sage)':pct>0?'var(--gold)':'var(--txl)')+'">'+
          (allMedsDone?'✅ Completa':ma.done+'/'+ma.total+' tomas')+
        '</span>'+
      '</div>';
    meds.forEach(function(m){
      (m.times||[]).forEach(function(t){
        var ok=isTaken(rec,m.id,t);
        html+='<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 10px;margin-bottom:6px;border-radius:11px;background:'+(ok?'rgba(58,158,114,.1)':'var(--bg2)')+';border:1.5px solid '+(ok?'var(--sage)33':'var(--bord)')+'">'+
          '<div style="flex:1">'+
            '<div style="font-size:14px;font-weight:700;color:'+(ok?'var(--sage)':'var(--tx)')+'">'+esc(m.name)+'</div>'+
            '<div style="font-size:11px;color:var(--txl)">'+t+(m.dose?' &middot; '+esc(m.dose):'')+'</div>'+

    '<div style="display:flex;align-items:center;justify-content:space-between">'+

      '<div style="text-align:center"><div style="font-size:22px;font-weight:700;color:var(--pri)">'+(rec.agua||0)+'</div><div style="font-size:10px;color:var(--txl)">copos</div></div>'+
      '<button onclick="adjAgua(1,\''+date+'\');renderRegRapido(document.getElementById(\'content\'))" style="background:rgba(74,123,181,.1);border:none;border-radius:8px;padding:6px 10px;font-size:16px;cursor:pointer;color:var(--pri)">+</button>'+

  html+='<div class="card" style="padding:12px">'+
    '<div style="font-size:12px;font-weight:700;color:var(--prid);margin-bottom:8px">&#128522; Humor</div>'+
    '<div style="display:flex;justify-content:space-between">';
  for(var hi=1;hi<=5;hi++){

    html+='<div onclick="rrHumor('+hi+')" style="font-size:20px;cursor:pointer;padding:4px;border-radius:8px;background:'+(hsel?'rgba(74,123,181,.15)':'transparent')+';border:2px solid '+(hsel?'var(--pri)':'transparent')+'" title="'+hi+'/5">'+humores[hi-1]+'</div>';
  }
  html+='</div></div>';
  html+='</div>';

  // ── NOTAS VISITA ──
  html+='<div class="card" style="margin-bottom:10px">'+
    '<div style="font-size:13px;font-weight:700;color:var(--prid);margin-bottom:8px">&#128221; Notas da visita</div>'+

    '<div style="font-size:11px;color:var(--txl);margin-top:4px">Guarda automaticamente enquanto escreve</div>'+
  '</div>';

  // ── BOTÃO GUARDAR ──
  html+='<button class="btn" onclick="saveRegRapido()" style="background:'+(allMedsDone&&lT?'var(--sage)':'var(--pri)')+'">'+
    (allMedsDone&&lT?'✅ Guardar e Concluir Visita':'&#10003; Guardar Registo')+'</button>';

  html+='<button onclick="go(\'relatorios\')" style="width:100%;background:transparent;border:1.5px solid var(--bord);border-radius:13px;padding:10px;font-size:13px;font-weight:600;color:var(--txm);cursor:pointer;margin-bottom:16px">&#128200; Ver histórico completo</button>';

  html+='</div>';
  el.innerHTML=html;
}
window.rrHumor=function(v){
  var r=getDay(todayKey());r.humor=v;setDay(todayKey(),r);
  renderRegRapido(document.getElementById('content'));
};
window.rrAutoSaveNotas=function(v){
  var r=getDay(todayKey());r.notas=v;setDay(todayKey(),r);
};
window.saveRegRapido=function(){
  var date=todayKey();
  var r=getDay(date);
  var sis=parseFloat(document.getElementById('rr-sis')&&document.getElementById('rr-sis').value);
  var dia=parseFloat(document.getElementById('rr-dia')&&document.getElementById('rr-dia').value);
  if(!isNaN(sis)&&!isNaN(dia)&&sis>0&&dia>0){
    if(!r.tensao)r.tensao=[];
    // Update last or push new
    if(r.tensao.length>0&&r.tensao[r.tensao.length-1].time===nowTime()){
      r.tensao[r.tensao.length-1]={sistolica:sis,diastolica:dia,time:nowTime()};
    } else {
      r.tensao.push({sistolica:sis,diastolica:dia,time:nowTime()});
    }
  }
  var notas=document.getElementById('rr-notas');
  if(notas)r.notas=notas.value;
  r.registadoPor='cuidador';
  setDay(date,r);
  var ma=getMedAdh(r);
  var allDone=ma&&ma.total>0&&ma.done===ma.total;
  openModal(
    '<div style="text-align:center;padding:12px 0">'+
    '<div style="font-size:56px;margin-bottom:10px">'+(allDone?'&#127881;':'✅')+'</div>'+
    '<div style="font-size:20px;font-weight:700;color:var(--sage);margin-bottom:6px">Visita registada!</div>'+
    '<div style="font-size:14px;color:var(--txm);margin-bottom:4px">'+new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})+' &middot; '+new Date().toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long'})+'</div>'+
    (ma&&ma.total?'<div style="font-size:13px;color:'+(allDone?'var(--sage)':'var(--gold)')+';margin-bottom:16px;font-weight:600">Medicação: '+ma.done+'/'+ma.total+' tomas confirmadas</div>':'')+
    '<button class="btn" style="margin-bottom:8px" onclick="closeModal();go(\'home\')">&#127968; Voltar ao início</button>'+
    '<button onclick="closeModal();renderRegRapido(document.getElementById(\'content\'))" style="width:100%;background:transparent;border:1.5px solid var(--bord);border-radius:12px;padding:10px;font-size:13px;cursor:pointer;color:var(--txm)">Continuar a registar</button>'+
    '</div>');
};

window.doLogin = function(){
  var isSupaConfigured = SUPA_URL && SUPA_URL !== 'COLOCA_AQUI_O_PROJECT_URL';
  if(isSupaConfigured){
    // Login com Supabase (email + password por utente)
    var email = document.getElementById('lemail');
    var pass = document.getElementById('lpass');
    if(!email || !pass) return;
    var btn = document.querySelector('.login-btn');
    if(btn){ btn.textContent = 'A entrar...'; btn.disabled = true; }
    supaLogin(email.value.trim(), pass.value.trim()).then(function(r){
      if(r.ok){
        ssSet('mv_auth','ok');
        ssSet('mv_supa_email', email.value.trim());
        var screen = document.getElementById('login-screen');
        if(screen) screen.remove();
        wrapSaveDB();
        if(!DB.appVersion) DB.appVersion=2;
        if(!DB.profile) DB.profile={};
        saveDB();
        realInit();
        pullFromSupa().then(function(){ if(typeof render==='function') render(); }).catch(function(){});
      } else {
        var err = document.getElementById('lerr');
        if(err){ err.textContent = r.error || 'Erro ao entrar.'; err.style.display='block'; }
        if(btn){ btn.textContent = '🔒 Entrar'; btn.disabled = false; }
        pass.value = ''; pass.focus();
        setTimeout(function(){ if(err) err.style.display='none'; }, 4000);
      }
    });
  } else {
    // Login local com password partilhada (modo sem Supabase)
    var pass2 = document.getElementById('lpass');
    if(!pass2) return;
    var val = pass2.value.trim();
    var stored = DB.customPass || APP_PASS;
    if(val === stored){
      ssSet('mv_auth','ok');
      var screen = document.getElementById('login-screen');
      if(screen) screen.remove();
      _loggedIn = true;
      realInit();
    } else {
      var err = document.getElementById('lerr');
      if(err) err.style.display='block';
      pass2.value=''; pass2.focus();
      setTimeout(function(){ if(err) err.style.display='none'; }, 3000);
    }
  }
};
window.doForgot = function(){
  var emailEl = document.getElementById('lemail');
  var email = emailEl ? emailEl.value.trim() : '';
  var msg = document.getElementById('lmsg');
  var err = document.getElementById('lerr');
  if(err) err.style.display='none';
  if(!email || email.indexOf('@')<0){
    if(emailEl){ emailEl.focus(); emailEl.style.borderColor='#fca5a5'; }
    if(msg){ msg.style.color='#fca5a5'; msg.textContent='Escreva primeiro o email do utente, em cima.'; msg.style.display='block'; }
    return;
  }
  if(msg){ msg.style.color='rgba(255,255,255,.7)'; msg.textContent='A enviar...'; msg.style.display='block'; }
  supaResetRequest(email).then(function(r){
    if(!msg) return;
    if(r.ok){
      msg.style.color='#86efac';
      msg.textContent='Email enviado! Verifique a caixa de correio (e o spam) e siga o link para definir uma nova password.';
    } else {
      msg.style.color='#fca5a5';
      msg.textContent = r.error || 'Não foi possível enviar o email.';
    }
  });
};

      '<input class="login-inp" type="password" id="np2" placeholder="Repetir nova password" maxlength="30" onkeydown="if(event.key===\'Enter\')doSetNewPass()">'+
      '<button class="login-btn" onclick="doSetNewPass()">Guardar nova password</button>'+
      '<div id="nperr" style="color:#fca5a5;font-size:13px;text-align:center;margin-top:10px;display:none"></div>'+
    '</div>';
  document.body.appendChild(div);
  setTimeout(function(){ var i=document.getElementById('np1'); if(i)i.focus(); },100);
}
window.doSetNewPass = function(){
  var p1=document.getElementById('np1'), p2=document.getElementById('np2'), err=document.getElementById('nperr');
  if(!p1||!p2) return;
  var v1=p1.value.trim(), v2=p2.value.trim();
  function fail(t){ if(err){ err.textContent=t; err.style.display='block'; } }
  if(v1.length<6){ fail('A password deve ter pelo menos 6 caracteres.'); return; }
  if(v1!==v2){ fail('As passwords não coincidem.'); p2.value=''; p2.focus(); return; }
  var btn=document.querySelector('#newpass-screen .login-btn');
  if(btn){ btn.textContent='A guardar...'; btn.disabled=true; }
  supaSetNewPassword(v1).then(function(r){
    if(r.ok){
      var s=document.getElementById('newpass-screen'); if(s) s.remove();
      ssSet('mv_auth','ok');
      if(typeof realInit==='function') realInit();
    } else {
      fail(r.error||'Não foi possível alterar a password.');
      if(btn){ btn.textContent='Guardar nova password'; btn.disabled=false; }
    }
  });
};

function realInit(){
  if(!DB.profile) DB.profile={};
  if(!DB.appVersion) DB.appVersion=2;
  if(!DB.mode) DB.mode='saude';


  if(DB.records){const cut=new Date();cut.setFullYear(cut.getFullYear()-1);const cs=cut.toISOString().slice(0,10);let p=false;Object.keys(DB.records).forEach(k=>{if(k<cs){delete DB.records[k];p=true;}});if(p)saveDB();}
  applyMode();
  // Always show setup if no profile OR if app hasn't been configured with new version
  if(!DB.profile||!DB.appVersion||DB.appVersion<2) if(!ssGet('mv_auth')){
    DB={};saveDB();
    document.getElementById('bottom-nav').style.display='none';
    showSetup(document.getElementById('content'));
    return;
  }
  document.getElementById('bottom-nav').style.display='flex';
  render();
  setInterval(()=>{applyMode();if(CS==='home'){const fn=SCR['home'];if(fn)fn(document.getElementById('content'));}},60000);
}
// End realInit


// Force app to fill window
function resizeApp(){
  var app = document.getElementById('app');
  if(app){
    app.style.width = window.innerWidth + 'px';
    app.style.height = window.innerHeight + 'px';
  }
}


function init(){
  if(checkLogin()){realInit();}else{showLogin();}
}

// ── SWIPE PARA RECUAR ──────────────────────────────────────────
function initSwipe(){
  var content=document.getElementById('content');
  if(!content) return;
  var tx0=0,ty0=0;
  content.addEventListener('touchstart',function(e){
    tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;
  },{passive:true});
  content.addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-tx0;
    var dy=e.changedTouches[0].clientY-ty0;
    if(dx>80&&Math.abs(dy)<60&&CS!=='home')goBack();
  },{passive:true});
}


// ── TECLA ESC / RETROCEDER ──────────────────────────────────────
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&CS!=='home'){goBack();}
});

function boot(){
  try {
    initSupabase();
    initSwipe();
    resizeApp();
    window.addEventListener('resize', resizeApp);
    window.addEventListener('orientationchange', function(){ setTimeout(resizeApp, 200); });
    init();
  } catch(e){
    console.error('Boot error:', e);
    var content=document.getElementById('content');
    if(content) content.innerHTML='<div style="padding:40px;text-align:center;color:#333"><h2>Erro ao carregar</h2><p>'+e.message+'</p><button onclick="location.reload()" style="padding:12px 24px;background:#e85a2e;color:#fff;border:none;border-radius:8px;margin-top:12px">Recarregar</button></div>';
  }
}
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

</script>
</body>
</html>
